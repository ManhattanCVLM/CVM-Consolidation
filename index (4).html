/* ---------- ui state ---------- */
const ui = { tab: "assess", area: null, dashArea: null, filter: "all", query: "", open: {}, showTable: false,
             areaFilter: [], level: "area", pick: null, reportAppendix: false };

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const resp = (aid, i) => state.responses[aid + "|" + i] || null;
function setResp(aid, i, patch) {
  /* The lock belongs to the app, not to one button. Guarding only the tap
     handler would mean any other route into scoring — a keyboard shortcut, a
     future screen, the console — quietly ignored the licence. Reads are
     untouched: everything already recorded stays visible and exportable. */
  if (LOCKED()) return;
  const k = aid + "|" + i;
  state.responses[k] = Object.assign({ sa: null, ea: null, sac: "", eac: "" }, state.responses[k], patch);
  save();
}

/* A score typed here by the moderator overrides any merged average.
   The contributing scores stay recorded so the audit trail survives. */
function setScore(aid, i, lane, v) {
  if (LOCKED()) return;
  const patch = lane === "self" ? { sa: v, saManual: v != null } : { ea: v, eaManual: v != null };
  setResp(aid, i, patch);
}

const SRC = { self: "saSrc", external: "eaSrc" };
const srcOf = (aid, i, lane) => { const r = resp(aid, i); return (r && r[SRC[lane]]) || []; };

/* Rendered wherever the notes for a question appear — the app, the CSV and the
   report — so the working behind an averaged score is always visible. */
function mergeNote(aid, i, lane) {
  const src = srcOf(aid, i, lane), r = resp(aid, i);
  if (!src.length) return "";
  const manual = r && (lane === "self" ? r.saManual : r.eaManual);
  const who = src.map(c => (c.by || "unnamed") + " " + c.v).join(", ");
  if (src.length === 1) return "Scored by " + who;
  const v = lane === "self" ? r.sa : r.ea;
  const mean = lane === "self" ? r.saMean : r.eaMean;
  if (manual) return "Merged from " + src.length + " assessors (" + who + "); set to " + v + " by moderator";
  const exact = mean == null ? v : Math.round(mean * 100) / 100;
  return "Averaged from " + src.length + " assessors (" + who + ") \u2192 " + exact +
         (exact !== v ? ", rounded down to " + v : "");
}
const isAveraged = (aid, i, lane) => srcOf(aid, i, lane).length > 1;
const val = (aid, i, lane) => { const r = resp(aid, i); return r ? (lane === "self" ? r.sa : r.ea) : null; };
const cmt = (aid, i, lane) => { const r = resp(aid, i); return r ? (lane === "self" ? (r.sac || "") : (r.eac || "")) : ""; };
const laneName = l => l === "self" ? "Self assessment" : "External assessment";

/* ---------- assessment type ----------
   self / external      score that lane
   comparison           read-only: two finished assessments loaded into the two
                        series slots and labelled by their own titles, so a client
                        can hold last year's assessment against this year's.
   The two-series machinery — charts, gaps, tables, report — is identical either
   way; only the labels change, which is why comparison needed no new analytics. */
/* An edition locked to one KIND of assessment is about that kind and nothing else.
   Anything cross-lane — the gap filter, the gap jump, the other side's score on a
   question card, the second column in the CSV — is not merely empty here, it is a
   reference to an assessment this copy of the app is not for. A restored backup
   can carry the other side's scores in the file; they stay in the data and out of
   the interface.

   Comparison is the exception, and it is not one: a locked edition can hold two
   assessments side by side, but they are two of ITS OWN kind — this year's self
   assessment against last year's — labelled by their titles. Two series, one kind,
   so the strip lifts while the words "self" and "external" still never appear
   opposite each other. Hence SOLO_UI rather than SOLO for anything visual. */
const SOLO = !!FIXED_LANE;
const COMPARING = () => state.type === "comparison";
const SOLO_UI = () => SOLO && !COMPARING();
/* Consolidating: both assessments held at once, and state.lane says only which
   of them a score typed by the moderator lands in. */
const CONSOLIDATING = () => state.type === "consolidate";
const typeName = t => t === "comparison" ? "Comparison" : laneName(t);

/* ---------- what the two series actually hold ----------
   The dashboard and the report name a series for the data in it, not for the
   slot it occupies. Holding two assessments side by side, "Self" and
   "External" (or the two titles) are the useful names. Holding one assessment
   on its own, the useful name is that assessment's title — a client running a
   single self assessment should see their own title on the chart, not the word
   "Self" against an empty "External".

   Scanning every response to answer that would be far too slow: the labels are
   asked for inside render loops. So it is computed once and cached, and the
   cache is dropped whenever anything is written (save) or a render begins. */
let LANES_CACHE = null;
function forgetLanes() { LANES_CACHE = null; }   /* declared, so save() can call it from above */
function lanesInPlay() {
  if (LANES_CACHE) return LANES_CACHE;
  let sa = false, ea = false;
  for (const k in state.responses) {
    const r = state.responses[k];
    if (!r) continue;
    if (!sa && r.sa != null) sa = true;
    if (!ea && r.ea != null) ea = true;
    if (sa && ea) break;
  }
  if (SOLO_UI()) {                  // a locked edition has exactly one side, whatever the file holds
    if (FIXED_LANE === "self") ea = false; else sa = false;
    return (LANES_CACHE = { sa, ea, only: FIXED_LANE === "self" ? "sa" : "ea", both: false });
  }
  /* Nothing scored yet counts as the lane being worked on, so a titled
     assessment carries its title from the first screen rather than acquiring
     it on the first tap. */
  let only = sa !== ea ? (sa ? "sa" : "ea") : null;
  if (!sa && !ea && !COMPARING()) only = state.lane === "external" ? "ea" : "sa";
  return (LANES_CACHE = { sa, ea, only, both: sa && ea });
}

const trim18 = t => t.length > 18 ? t.slice(0, 17) + "\u2026" : t;

/* Long and short labels for the two series, whatever they currently represent. */
function seriesLabel(slot, short) {
  if (COMPARING()) {
    const t = slot === "sa" ? (state.cmpA && state.cmpA.title) : (state.cmpB && state.cmpB.title);
    const fallback = slot === "sa" ? "Assessment A" : "Assessment B";
    if (!t) return fallback;
    return short ? trim18(t) : t;
  }
  const title = (state.title || "").trim();
  if (title && lanesInPlay().only === slot) return short ? trim18(title) : title;
  if (slot === "sa") return short ? "Self" : "Self assessment";
  return short ? "Ext" : "External assessment";
}

/* The heading the dashboard and the report put at the top: what am I looking at?
   Returns the pieces rather than markup, so both can lay it out their own way. */
function dashSubject() {
  const client = (state.client || "").trim();
  if (COMPARING()) {
    return { kind: "comparison", client,
             a: state.cmpA ? (state.cmpA.title || "Untitled assessment") : null,
             b: state.cmpB ? (state.cmpB.title || "Untitled assessment") : null };
  }
  const L = lanesInPlay();
  return { kind: L.both ? "two-lane" : "single", client,
           title: (state.title || "").trim(),
           lane: L.both ? null : (L.only === "ea" ? "external" : "self") };
}
const LBL_A = s => seriesLabel("sa", s);
const LBL_B = s => seriesLabel("ea", s);
const cmpLoaded = () => !!(state.cmpA && state.cmpB);
const fmt = n => n == null ? "—" : (Math.round(n * 10) / 10).toFixed(1);

function stats(qs, aid) {
  const sa = [], ea = []; let both = 0;
  qs.forEach((q, i) => {
    const idx = q.__i != null ? q.__i : i;
    const s = val(aid, idx, "self"), e = val(aid, idx, "external");
    if (s != null) sa.push(s);
    if (e != null) ea.push(e);
    if (s != null && e != null) both++;
  });
  const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  return { n: qs.length, saN: sa.length, eaN: ea.length, both, sa: avg(sa), ea: avg(ea), gap: (avg(ea) != null && avg(sa) != null) ? avg(ea) - avg(sa) : null };
}
const areaStats = a => stats(a.questions.map((q, i) => (q.__i = i, q)), a.id);

function subjectsOf(a) {
  const m = new Map();
  a.questions.forEach((q, i) => {
    if (!m.has(q.subject)) m.set(q.subject, []);
    m.get(q.subject).push(Object.assign({}, q, { __i: i }));
  });
  return [...m.entries()].map(([name, qs]) => ({ name, qs }));
}

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t.__t); t.__t = setTimeout(() => t.classList.remove("show"), 1900);
}
function pctLabel(done, total) {
  if (!total) return 0;
  const p = (done / total) * 100;
  return done >= total ? 100 : Math.min(99, Math.round(p));
}
function ring(pct, size, done, total) {
  const sz = size || 46, r = (sz - 6) / 2, c = 2 * Math.PI * r;
  return `<div class="ring"><svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" aria-hidden="true">
    <circle cx="${sz / 2}" cy="${sz / 2}" r="${r}" fill="none" stroke="var(--grid)" stroke-width="4"/>
    <circle cx="${sz / 2}" cy="${sz / 2}" r="${r}" fill="none" stroke="var(--seq-400)" stroke-width="4"
      stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c * (1 - pct)).toFixed(1)}"/>
  </svg><div class="pct">${done != null ? pctLabel(done, total) : Math.round(pct * 100)}%</div></div>`;
}
function gapChip(g) {
  if (g == null) return `<span class="gapchip flat">n/a</span>`;
  const r = Math.round(g * 10) / 10;
  if (Math.abs(r) < 0.05) return `<span class="gapchip flat">&#9644; aligned</span>`;
  const who = COMPARING() ? "B" : "ext";
  return r > 0
    ? `<span class="gapchip over">&#9650; ${who} +${r.toFixed(1)}</span>`
    : `<span class="gapchip under">&#9660; ${who} ${r.toFixed(1)}</span>`;
}

/* ============================================================
   ASSESS
   ============================================================ */
function renderAssess() {
  const v = $("#view-assess");
  if (!ui.area) { v.innerHTML = areaListHTML(); return; }
  v.innerHTML = areaDetailHTML(AREA_BY_ID[ui.area]);
}

function areaListHTML() {
  let sa = [], ea = [];
  DATA.areas.forEach(a => a.questions.forEach((q, i) => {
    const s = val(a.id, i, "self"), e = val(a.id, i, "external");
    if (s != null) sa.push(s); if (e != null) ea.push(e);
  }));
  const avg = x => x.length ? x.reduce((p, c) => p + c, 0) / x.length : null;
  const laneDone = state.lane === "self" ? sa.length : ea.length;

  return `
  ${LOGO ? `<div class="logoplate"><img src="${LOGO}" alt="Manhattan CVLM"></div>` : ""}
  <div class="card tight">
    <div class="card-title">${esc(state.client || "Client not set \u2014 add it in Setup")}</div>
    <div style="display:flex;align-items:center;gap:14px;margin-top:9px">
      ${ring(laneDone / TOTAL_Q, 52, laneDone, TOTAL_Q)}
      <div style="flex:1;min-width:0">
        <div style="font-size:14px;font-weight:600">${laneDone} of ${TOTAL_Q} scored</div>
        <div style="font-size:12.5px;color:var(--text-muted);margin-top:2px">${esc(COMPARING() ? "Comparison" : laneName(state.lane))} &middot; ${DATA.areas.length} areas</div>
      </div>
      <div style="text-align:right;flex:none">
        <div style="font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);font-weight:650">Avg</div>
        <div style="font-size:22px;font-weight:680;font-variant-numeric:tabular-nums;line-height:1.1">${fmt(state.lane === "self" ? avg(sa) : avg(ea))}</div>
      </div>
    </div>
  </div>
  ${laneSwitchHTML()}
  <div class="section-label">Assessment areas</div>
  <div class="arealist">
    ${DATA.areas.map(a => {
      const st = areaStats(a);
      const done = state.lane === "self" ? st.saN : st.eaN;
      const mine = state.lane === "self" ? st.sa : st.ea;
      return `<button class="arearow" data-area="${a.id}">
        ${ring(done / st.n, 46, done, st.n)}
        <div class="meta">
          <div class="nm">${esc(a.name)}</div>
          <div class="dt"><span>${done}/${st.n} scored</span><span>&middot;</span><span>avg ${fmt(mine)}</span></div>
        </div>
        <div class="chev">&#8250;</div>
      </button>`;
    }).join("")}
  </div>`;
}

/* No lane switch on the assessor editions' scoring screens. The assessment type
   is set once in Setup, so a score can never land in a lane you did not mean —
   which is the whole reason the comparison edition exists separately from the
   assessor ones. This shows which lane is live instead.

   The consolidator is the exception: it holds both assessments, so moderating a
   score means saying which one, and making that a trip to Setup would be absurd
   when the fix is one tap away from the question. */
function laneSwitchHTML() {
  if (CONSOLIDATING()) {
    const L = lanesInPlay();
    const n = lane => { const k = lane === "self" ? "sa" : "ea"; return L[k] ? "" : " (empty)"; };
    return `<div class="lanebar lane-${state.lane}">
      <span>Moderating</span>
      <div class="lanes laneseg" role="group" aria-label="Which assessment a score you type lands in">
        <button data-setlane="self" aria-pressed="${state.lane === "self"}"><i class="swatch sw1"></i>Self${n("self")}</button>
        <button data-setlane="external" aria-pressed="${state.lane === "external"}"><i class="swatch sw2"></i>External${n("external")}</button>
      </div>
    </div>`;
  }
  if (COMPARING()) {
    return `<div class="lanebar lane-cmp">
      <i class="swatch sw1"></i><i class="swatch sw2" style="margin-left:-4px"></i>
      <span>Comparison${cmpLoaded() ? "" : " \u2014 import two assessments"}</span>
      <button class="linkbtn" data-gotolane>${cmpLoaded() ? "Change in Setup" : "Set up"}</button>
    </div>`;
  }
  /* Nothing to say in an app that only does one assessment. The header above
     already names it on every screen, the app is called after it, and the whole
     bar existed to answer "which one am I in?" back when one app did both.
     "Fixed for this edition" was worse than redundant: "edition" is a word from
     the build system, and an assessor holding a single app has nothing to
     contrast it with. */
  if (SOLO) return "";
  return `<div class="lanebar lane-${state.lane}">
    <i class="swatch ${state.lane === "self" ? "sw1" : "sw2"}"></i>
    <span>${esc(laneName(state.lane))}</span>
    <button class="linkbtn" data-gotolane>Change in Setup</button>
  </div>`;
}

const AVG_IN_AREA = a => a.questions.filter((q, i) => isAveraged(a.id, i, "self") || isAveraged(a.id, i, "external")).length;

function matches(q, aid, i) {
  if (ui.query) {
    const t = (q.q + " " + q.subject).toLowerCase();
    if (!ui.query.toLowerCase().split(/\s+/).every(w => t.includes(w))) return false;
  }
  const v = val(aid, i, state.lane);
  if (ui.filter === "todo" && v != null) return false;
  if (ui.filter === "done" && v == null) return false;
  if (ui.filter === "gap") {
    const s = val(aid, i, "self"), e = val(aid, i, "external");
    if (s == null || e == null || Math.abs(e - s) < 2) return false;
  }
  if (ui.filter === "avg" && !isAveraged(aid, i, "self") && !isAveraged(aid, i, "external")) return false;
  return true;
}

function areaDetailHTML(a) {
  const st = areaStats(a);
  const done = state.lane === "self" ? st.saN : st.eaN;
  const flat = ui.query || ui.filter !== "all";
  const subs = subjectsOf(a);
  const shown = subs.map(s => ({ name: s.name, qs: s.qs.filter(q => matches(q, a.id, q.__i)) })).filter(s => s.qs.length);
  const nShown = shown.reduce((n, s) => n + s.qs.length, 0);

  return `
  ${laneSwitchHTML()}
  <div class="card tight">
    <div style="display:flex;align-items:center;gap:13px">
      ${ring(done / st.n, 46, done, st.n)}
      <div style="flex:1;min-width:0">
        <div style="font-size:14px;font-weight:600">${done}/${st.n} scored &middot; avg ${fmt(state.lane === "self" ? st.sa : st.ea)}</div>
        <div style="font-size:12.5px;color:var(--text-muted);margin-top:2px">${subs.length} subject areas</div>
      </div>
      ${st.both ? gapChip(st.gap) : ""}
    </div>
  </div>
  <div class="searchwrap">
    <input type="search" id="qsearch" placeholder="Search questions" value="${esc(ui.query)}" enterkeyhint="search" autocapitalize="none">
    ${ui.query ? `<button class="clr" id="qclear" aria-label="Clear search">&#10005;</button>` : ""}
  </div>
  <div class="filters">
    <button class="chip" data-filter="all" aria-pressed="${ui.filter === "all"}">All ${st.n}</button>
    <button class="chip" data-filter="todo" aria-pressed="${ui.filter === "todo"}">Unanswered ${st.n - done}</button>
    <button class="chip" data-filter="done" aria-pressed="${ui.filter === "done"}">Answered ${done}</button>
    ${SOLO_UI() ? "" : `<button class="chip" data-filter="gap" aria-pressed="${ui.filter === "gap"}">Gap &ge; 2</button>`}
    ${AVG_IN_AREA(a) ? `<button class="chip" data-filter="avg" aria-pressed="${ui.filter === "avg"}">Averaged ${AVG_IN_AREA(a)}</button>` : ""}
  </div>
  ${nShown === 0
    ? `<div class="empty"><div class="big">Nothing to show</div><div>No questions match this filter or search.</div></div>`
    : shown.map(s => {
      const key = a.id + "::" + s.name;
      const open = flat ? true : !!ui.open[key];
      const sdone = s.qs.filter(q => val(a.id, q.__i, state.lane) != null).length;
      const sst = stats(s.qs, a.id);
      return `<div class="subjgroup">
        <button class="subjhead" data-subj="${esc(key)}" aria-expanded="${open}">
          <span class="caret">&#9654;</span>
          <span class="nm">${esc(s.name)}</span>
          <span class="cnt">${sdone}/${s.qs.length}</span>
          <span class="dualpair" aria-hidden="true">
            ${SOLO_UI()
              ? (() => { const v = FIXED_LANE === "self" ? sst.sa : sst.ea;
                         const c = FIXED_LANE === "self" ? "d1" : "d2";
                         return `<span class="${v != null ? c : "dn"}">${v != null ? fmt(v) : "–"}</span>`; })()
              : `<span class="${sst.sa != null ? "d1" : "dn"}">${sst.sa != null ? fmt(sst.sa) : "–"}</span>
                 <span class="${sst.ea != null ? "d2" : "dn"}">${sst.ea != null ? fmt(sst.ea) : "–"}</span>`}
          </span>
        </button>
        <div class="subjbody" ${open ? "" : "hidden"}>${s.qs.map(q => qCardHTML(a, q)).join("")}</div>
      </div>`;
    }).join("")}`;
}

function qCardHTML(a, q) {
  const i = q.__i, mine = val(a.id, i, state.lane), other = state.lane === "self" ? "external" : "self";
  const otherV = val(a.id, i, other), myC = cmt(a.id, i, state.lane), otherC = cmt(a.id, i, other);
  const lvl = mine != null ? LEVELS[mine - 1] : null;
  const myNote = mergeNote(a.id, i, state.lane), otherNote = mergeNote(a.id, i, other);
  return `<div class="qcard lane-${state.lane}" data-q="${a.id}|${i}" id="q-${a.id}-${i}">
    <span class="subjtag">${esc(q.subject)}</span>
    <div class="qhead"><span class="qnum">Q${i + 1}</span><div class="qtext">${esc(q.q)}</div></div>
    ${COMPARING()
      ? `<div class="cmprow">
           <span><i class="swatch sw1"></i>${esc(LBL_A(true))}<b>${val(a.id, i, "self") == null ? "\u2014" : val(a.id, i, "self")}</b></span>
           <span><i class="swatch sw2"></i>${esc(LBL_B(true))}<b>${val(a.id, i, "external") == null ? "\u2014" : val(a.id, i, "external")}</b></span>
           ${(() => { const s = val(a.id, i, "self"), e = val(a.id, i, "external");
                      return (s != null && e != null) ? gapChip(e - s) : ""; })()}
         </div>`
      : `<div class="scale" role="group" aria-label="${esc(laneName(state.lane))} score, 1 to 8">
      ${LEVELS.map((L, k) => `<button data-score="${k + 1}" aria-pressed="${mine === k + 1}" aria-label="${k + 1} — ${esc(L[0])}">${k + 1}</button>`).join("")}
    </div>`}
    ${COMPARING() ? "" : `<div class="scalefoot">
      <div class="levelname ${lvl ? "" : "empty"}">${lvl ? esc(mine + " · " + lvl[0]) : "Not yet scored"}</div>
      ${(!SOLO_UI() && otherV != null) ? `<div class="otherlane"><i class="swatch ${other === "self" ? "sw1" : "sw2"}"></i>${esc(other === "self" ? LBL_A(true) : LBL_B(true))} ${otherV}</div>` : ""}
    </div>`}
    ${myNote ? `<div class="srcline ${isAveraged(a.id, i, state.lane) ? "avg" : ""}">${esc(myNote)}</div>` : ""}
    ${(!SOLO_UI() && otherNote) ? `<div class="srcline other">${esc(other === "self" ? LBL_A(true) : LBL_B(true))}: ${esc(otherNote)}</div>` : ""}
    <div class="qactions" ${COMPARING() ? "hidden" : ""}>
      <button class="minibtn ${myC ? "on" : ""}" data-act="comment">&#9998; ${myC ? "Edit note" : "Add note"}</button>
      ${mine != null ? `<button class="minibtn" data-act="clear">Clear score</button>` : ""}
    </div>
    <div class="cmtwrap" hidden>
      <label>${esc(laneName(state.lane))} comments</label>
      <textarea data-cmt placeholder="Evidence, rationale, objectives…">${esc(myC)}</textarea>
      <div class="qactions"><button class="minibtn" data-act="savecmt">Save note</button><button class="minibtn" data-act="cancelcmt">Cancel</button></div>
    </div>
    ${myC ? `<div class="savedcmt"><b>${esc(state.lane === "self" ? "Self note" : "External note")}</b>${esc(myC)}</div>` : ""}
    ${(!SOLO_UI() && otherC) ? `<div class="savedcmt"><b>${esc(other === "self" ? "Self note" : "External note")}</b>${esc(otherC)}</div>` : ""}
  </div>`;
}
/* ============================================================
   DASHBOARD — charts, slicer filters, gap analysis
   Mirrors the workbook Dashboard: a radar and a grouped bar of
   Self vs External, driven by an Assessment Area slicer, at either
   area or subject level (the workbook's two pivot levels).
   ============================================================ */
const MAXS = 8;

/* ---------- slicer ---------- */
function activeAreas() {
  const sel = ui.areaFilter;
  if (!sel || !sel.length) return DATA.areas;
  const set = new Set(sel);
  const hit = DATA.areas.filter(a => set.has(a.id));
  return hit.length ? hit : DATA.areas;
}

/* ---------- category rollups ---------- */
function chartCats() {
  const areas = activeAreas();
  if (ui.level === "subject") {
    const out = [];
    areas.forEach(a => subjectsOf(a).forEach(s => {
      out.push({ key: a.id + "::" + s.name, name: s.name, area: a.name, aid: a.id, st: stats(s.qs, a.id) });
    }));
    return out;
  }
  return areas.map(a => ({ key: a.id, name: a.name, area: a.name, aid: a.id, st: areaStats(a) }));
}

function filteredQuestions() {
  const out = [];
  activeAreas().forEach(a => a.questions.forEach((q, i) => out.push({ a, q, i })));
  return out;
}

function overallStats() {
  const sa = [], ea = [];
  let both = 0, n = 0;
  filteredQuestions().forEach(({ a, i }) => {
    n++;
    const s = val(a.id, i, "self"), e = val(a.id, i, "external");
    if (s != null) sa.push(s);
    if (e != null) ea.push(e);
    if (s != null && e != null) both++;
  });
  const avg = x => x.length ? x.reduce((p, c) => p + c, 0) / x.length : null;
  const oSa = avg(sa), oEa = avg(ea);
  return { n, saN: sa.length, eaN: ea.length, both, sa: oSa, ea: oEa, gap: (oSa != null && oEa != null) ? oEa - oSa : null };
}

const svgEsc = s => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const short = (s, n) => s.length > n ? s.slice(0, n - 1).trimEnd() + "…" : s;

/* Radar spokes have little horizontal room, so shorten the long standard words
   and wrap what's left over two lines rather than truncating mid-word. */
const ABBR = [[/\bManagement\b/g, "Mgmt"], [/\bProgramme\b/g, "Prog"], [/\bAssessment\b/g, "Assmt"],
              [/\bContinuous\b/g, "Cont."], [/\bCommunication\b/g, "Comms"], [/\bImprovement\b/g, "Improv."]];
function chartLabel(s) {
  let t = String(s);
  ABBR.forEach(([re, to]) => { t = t.replace(re, to); });
  return t;
}
function wrapLabel(s, maxChars, maxLines) {
  const words = chartLabel(s).split(/\s+/);
  const lines = [];
  let cur = "";
  for (const w of words) {
    const next = cur ? cur + " " + w : w;
    if (next.length <= maxChars || !cur) { cur = next; continue; }
    lines.push(cur); cur = w;
    if (lines.length === maxLines - 1) break;
  }
  if (cur && lines.length < maxLines) lines.push(cur);
  const used = lines.join(" ").length;
  const total = chartLabel(s).length;
  if (used < total) lines[lines.length - 1] = short(lines[lines.length - 1] + "…", maxChars + 1);
  return lines;
}

/* ============================================================
   RADAR
   ============================================================ */
/* Spoke labels only fit when the plot is wide. On a phone the numbered key
   below the radar is clearer than seven truncated names crowding the edge.
   The report always numbers, so its chart looks the same whichever device
   generated it and always matches the printed key. */
let REPORT_MODE = false;
const numberedFor = N => REPORT_MODE || N > 8 || window.innerWidth < 480;

function radarSVG(cats, W, slots) {
  slots = slots || ["sa", "ea"];
  const N = cats.length;
  if (!N) return "";
  const size = Math.min(W, 520);
  const R = (size - (numberedFor(N) ? 62 : 108)) / 2;
  const cx = size / 2, cy = size / 2;
  const numbered = numberedFor(N);              // long label sets get a numbered key instead
  const angle = i => (-90 + i * 360 / N) * Math.PI / 180;
  const pt = (i, v) => {
    const a = angle(i), r = R * (v / MAXS);
    return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  };
  let g = "";

  // rings + scale labels
  [2, 4, 6, 8].forEach(v => {
    const pts = [];
    for (let i = 0; i < N; i++) pts.push(pt(i, v).map(n => n.toFixed(1)).join(","));
    g += `<polygon points="${pts.join(" ")}" fill="none" stroke="var(--grid)" stroke-width="1"/>`;
    g += `<text x="${(cx + 5).toFixed(1)}" y="${(cy - R * (v / MAXS) + 3.5).toFixed(1)}" font-size="9.5" fill="var(--text-muted)" font-family="inherit">${v}</text>`;
  });

  // spokes + category labels
  for (let i = 0; i < N; i++) {
    const [x, y] = pt(i, MAXS);
    g += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>`;
    const a = angle(i), lx = cx + (R + 13) * Math.cos(a), ly = cy + (R + 13) * Math.sin(a);
    const cos = Math.cos(a);
    const anchor = Math.abs(cos) < 0.25 ? "middle" : (cos > 0 ? "start" : "end");
    const on = ui.pick === cats[i].key;
    const lines = numbered ? [String(i + 1)] : wrapLabel(cats[i].name, size < 400 ? 13 : 17, 2);
    const y0 = ly + 3.5 - (lines.length - 1) * 5.5;
    g += `<text x="${lx.toFixed(1)}" y="${y0.toFixed(1)}" text-anchor="${anchor}" font-size="${numbered ? 11.5 : 10.5}"
      font-weight="${on ? 700 : 500}" fill="${on ? "var(--text-primary)" : "var(--text-secondary)"}"
      font-family="inherit">${lines.map((ln, k) => `<tspan x="${lx.toFixed(1)}" dy="${k ? 11 : 0}">${svgEsc(ln)}</tspan>`).join("")}</text>`;
  }

  // series — self drawn first so external reads on top
  slots.forEach(k => {
    const col = SERIES[k].css;
    if (cats.every(c => c.st[k] == null)) return;
    const pts = cats.map((c, i) => pt(i, c.st[k] == null ? 0 : c.st[k]));
    g += `<polygon points="${pts.map(p => p.map(n => n.toFixed(1)).join(",")).join(" ")}"
      fill="${col}" fill-opacity="0.10" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>`;
    pts.forEach((p, i) => {
      if (cats[i].st[k] == null) return;
      g += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${ui.pick === cats[i].key ? 5.5 : 4}"
        fill="${col}" stroke="var(--surface-1)" stroke-width="2"/>`;
    });
  });

  // transparent tap wedges — the hit area is the whole sector, not the 8px dot
  for (let i = 0; i < N; i++) {
    const a0 = angle(i) - Math.PI / N, a1 = angle(i) + Math.PI / N;
    const p0 = [cx + (R + 20) * Math.cos(a0), cy + (R + 20) * Math.sin(a0)];
    const p1 = [cx + (R + 20) * Math.cos(a1), cy + (R + 20) * Math.sin(a1)];
    g += `<polygon class="wedge" points="${cx},${cy} ${p0.map(n => n.toFixed(1)).join(",")} ${p1.map(n => n.toFixed(1)).join(",")}"
      fill="transparent" data-cat="${svgEsc(cats[i].key)}" tabindex="0" role="button"
      aria-label="${svgEsc(cats[i].name)}: ${slots.map(k => SERIES[k].lbl(true) + " " + fmt(cats[i].st[k])).join(", ")}"/>`;
  }

  return `<svg class="radar" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img"
    aria-label="Radar chart of ${svgEsc(slots.map(k => SERIES[k].lbl()).join(" and "))} maturity across ${N} categories">${g}</svg>`;
}

function radarKeyHTML(cats) {
  if (!numberedFor(cats.length)) return "";
  return `<ol class="radarkey">${cats.map((c, i) =>
    `<li data-cat="${esc(c.key)}" class="${ui.pick === c.key ? "on" : ""}"><b>${i + 1}</b><span>${esc(c.name)}</span></li>`).join("")}</ol>`;
}

/* ============================================================
   GROUPED BAR
   ============================================================ */
function barsSVG(cats, W, slots) {
  slots = slots || ["sa", "ea"];
  const N = cats.length;
  if (!N) return "";
  const gutter = 36, rowH = slots.length > 1 ? 50 : 37, top = 6, axisH = 20;
  const plotW = W - gutter;
  const H = top + N * rowH + axisH;
  const x = v => (v == null ? 0 : (v / MAXS) * plotW);
  let g = "";

  cats.forEach((c, i) => {
    if (ui.pick !== c.key) return;
    g += `<rect x="-8" y="${top + i * rowH - 2}" width="${W + 10}" height="${rowH - 2}" rx="8" fill="var(--surface-0)"/>`;
  });

  [0, 2, 4, 6, 8].forEach(v => {
    const gx = x(v).toFixed(1);
    g += `<line x1="${gx}" y1="${top}" x2="${gx}" y2="${top + N * rowH - 6}" stroke="var(--grid)" stroke-width="1"/>`;
    g += `<text x="${gx}" y="${H - 5}" font-size="10" fill="var(--text-muted)" font-family="inherit"
      text-anchor="${v === 0 ? "start" : v === MAXS ? "end" : "middle"}">${v}</text>`;
  });

  cats.forEach((c, i) => {
    const y0 = top + i * rowH;
    const on = ui.pick === c.key;
    g += `<text x="0" y="${y0 + 12}" font-size="12.5" font-weight="${on ? 700 : 600}" fill="var(--text-primary)"
      font-family="inherit">${svgEsc(short(c.name, Math.max(18, Math.floor(W / 7.6))))}</text>`;

    // an 11px bar per series, 2px surface gap between them, 4px rounded data-end
    slots.forEach((k, j) => {
      const col = SERIES[k].css;
      const v = c.st[k], by = y0 + 19 + j * 13;
      if (v == null) {
        if (j === 0) g += `<text x="0" y="${by + 17}" font-size="10.5" fill="var(--text-muted)" font-family="inherit">not scored</text>`;
        return;
      }
      const w = Math.max(4, x(v));
      g += `<path d="M0 ${by} H${(w - 4).toFixed(1)} a4 4 0 0 1 4 4 v3 a4 4 0 0 1 -4 4 H0 Z" fill="${col}"/>`;
      g += `<text x="${(w + 6).toFixed(1)}" y="${by + 9}" font-size="11" font-weight="650"
        fill="var(--text-secondary)" font-family="inherit">${fmt(v)}</text>`;
    });

    g += `<rect x="-8" y="${y0 - 2}" width="${W + 10}" height="${rowH - 2}" fill="transparent"
      data-cat="${svgEsc(c.key)}" tabindex="0" role="button"
      aria-label="${svgEsc(c.name)}: ${slots.map(k => SERIES[k].lbl(true) + " " + fmt(c.st[k])).join(", ")}"/>`;
  });

  return `<svg class="barchart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img"
    aria-label="Bar chart of ${svgEsc(slots.map(k => SERIES[k].lbl()).join(" and "))} maturity across ${N} categories">${g}</svg>`;
}

/* ============================================================
   VIEW
   ============================================================ */
/* A legend lists the series that are on the chart. With one assessment loaded
   there is one series, and a second entry naming an empty one is a claim the
   chart does not support. */
const SERIES = { sa: { css: "var(--series-1)", sw: "sw1", lbl: LBL_A },
                 ea: { css: "var(--series-2)", sw: "sw2", lbl: LBL_B } };
function dashSlots() {
  if (SOLO_UI()) return [FIXED_LANE === "self" ? "sa" : "ea"];   // one assessment, full stop
  if (COMPARING()) return ["sa", "ea"];          // both expected; an empty slot is worth showing
  const L = lanesInPlay();
  if (L.both) return ["sa", "ea"];
  return [L.only || "sa"];
}
const legendHTML = slots => `<div class="legend">${slots.map(k =>
  `<span><i style="background:${SERIES[k].css}"></i>${esc(SERIES[k].lbl())}</span>`).join("")}</div>`;

/* The dashboard says which assessment it is showing, by name. Without this the
   only thing naming the data was the series labels, which is thin when there is
   one series and ambiguous when there are two. */
function dashHeadHTML(o) {
  const d = dashSubject();
  if (d.kind === "comparison") {
    const row = (t, k, slot) => `<span><i class="swatch ${SERIES[k].sw}"></i>${
      t ? esc(t) : `<em>Assessment ${slot} \u2014 not loaded</em>`}</span>`;
    return `<div class="dashhead">
      <div class="dh-kicker">Comparing two assessments</div>
      <div class="dh-pair">${row(d.a, "sa", "A")}<span class="vs">versus</span>${row(d.b, "ea", "B")}</div>
      <div class="dh-sub">${d.client ? esc(d.client) + " &middot; " : ""}${o.both} of ${o.n} questions in both</div>
    </div>`;
  }
  const name = d.title || d.client || "Untitled assessment";
  const scored = d.kind === "two-lane" ? `${o.saN} self and ${o.eaN} external answers`
    : `${(d.lane === "external" ? o.eaN : o.saN)} of ${o.n} scored`;
  return `<div class="dashhead">
    <div class="dh-kicker">${d.kind === "two-lane" ? "Self versus external" : esc(laneName(d.lane))}</div>
    <div class="dh-title">${esc(name)}</div>
    <div class="dh-sub">${d.client && d.title ? esc(d.client) + " &middot; " : ""}${scored}</div>
  </div>`;
}

function slicerHTML() {
  const sel = new Set(ui.areaFilter || []);
  return `<div class="slicer">
    <div class="slicer-head">
      <span>Assessment area</span>
      ${sel.size ? `<button class="linkbtn" data-slice="__clear">Clear (${sel.size})</button>`
                 : `<span class="slicer-all">All ${DATA.areas.length}</span>`}
    </div>
    <div class="filters">
      ${DATA.areas.map(a => `<button class="chip" data-slice="${a.id}" aria-pressed="${sel.has(a.id)}">${esc(a.name)}</button>`).join("")}
    </div>
    <div class="lanes" role="group" aria-label="Detail level" style="margin:10px 0 0">
      <button data-level="area" aria-pressed="${ui.level !== "subject"}">By area</button>
      <button data-level="subject" aria-pressed="${ui.level === "subject"}">By subject</button>
    </div>
  </div>`;
}

function readoutHTML(cats, withDrill, slots) {
  const c = ui.pick == null ? null : cats.find(x => x.key === ui.pick);
  if (!c) return `<div class="readout muted">Tap a point or a bar for its figures.</div>`;
  return `<div class="readout">
    <div class="ro-name">${esc(c.name)}${ui.level === "subject" ? `<span class="ro-area">${esc(c.area)}</span>` : ""}</div>
    <div class="ro-vals">
      ${slots.map(k => `<span><i class="swatch ${SERIES[k].sw}"></i><b>${fmt(c.st[k])}</b> ${esc(SERIES[k].lbl(true))}</span>`).join("")}
      ${slots.length > 1 ? gapChip(c.st.gap) : ""}
      <span class="ro-n">${c.st.n} q</span>
    </div>
    ${withDrill && ui.level === "area"
      ? `<button class="minibtn" style="margin-top:9px" data-drill="${esc(c.aid)}">Break down by subject &#8250;</button>`
      : `<button class="minibtn" style="margin-top:9px" data-openarea="${esc(c.aid)}">Open questions &#8250;</button>`}
  </div>`;
}

function renderDash() {
  const v = $("#view-dash");
  const cats = chartCats();
  if (ui.pick != null && !cats.some(c => c.key === ui.pick)) ui.pick = null;

  const o = overallStats();
  const areas = activeAreas();
  const scope = areas.length === DATA.areas.length ? "All areas"
    : areas.length === 1 ? areas[0].name : areas.length + " areas selected";

  const gaps = filteredQuestions().map(({ a, q, i }) => {
    const s = val(a.id, i, "self"), e = val(a.id, i, "external");
    return (s == null || e == null) ? null : { area: a.name, aid: a.id, subj: q.subject, q: q.q, s, e, g: e - s, i };
  }).filter(Boolean).filter(x => x.g !== 0).sort((x, y) => Math.abs(y.g) - Math.abs(x.g)).slice(0, 12);

  const radarTooMany = cats.length > 14;
  const slots = dashSlots();                 // which series the data actually supports
  const two = slots.length > 1;
  const primary = slots[0];                  // "weakest first" sorts on the series in play
  const sorted = cats.slice().sort((a, b) =>
    (a.st[primary] == null ? 99 : a.st[primary]) - (b.st[primary] == null ? 99 : b.st[primary]));

  v.innerHTML = `
  ${dashHeadHTML(o)}
  ${slicerHTML()}

  <div class="hero">
    ${slots.map(k => `<div class="tile">
      <div class="lbl"><i class="swatch ${SERIES[k].sw}"></i>${esc(SERIES[k].lbl(two))}</div>
      <div class="val">${fmt(o[k])}<small> /8</small></div>
      <div class="cap">${!two && o[k] != null ? esc(levelFor(o[k])) + " &middot; " : ""}${k === "sa" ? o.saN : o.eaN} of ${o.n} scored</div>
    </div>`).join("")}
  </div>

  ${!two ? "" : `<div class="card tight">
    <div class="card-title" style="margin-bottom:7px">Overall alignment &middot; ${esc(scope)}</div>
    <div style="display:flex;align-items:center;gap:12px">
      <div style="font-size:27px;font-weight:680;font-variant-numeric:tabular-nums;line-height:1.1">${o.gap == null ? "\u2014" : (o.gap > 0 ? "+" : "") + fmt(o.gap)}</div>
      <div style="flex:1;min-width:0;font-size:12.5px;color:var(--text-secondary);line-height:1.35">
        ${o.gap == null ? "Both assessments needed to compare."
          : COMPARING()
            ? (Math.abs(o.gap) < 0.25 ? "The two assessments are broadly level."
               : o.gap < 0 ? esc(LBL_B()) + " scores lower overall than " + esc(LBL_A()) + "."
               : esc(LBL_B()) + " scores higher overall than " + esc(LBL_A()) + " \u2014 maturity has moved on.")
          : Math.abs(o.gap) < 0.25 ? "External and self assessments broadly agree."
          : o.gap < 0 ? "External assessor scores lower than self assessment \u2014 likely over-confidence."
          : "External assessor scores higher than self assessment \u2014 likely under-recognised capability."}
      </div>
    </div>
    <div class="meter" aria-hidden="true"><i style="width:${o.n ? ((o.both / o.n) * 100).toFixed(1) : 0}%"></i></div>
    <div style="font-size:11.5px;color:var(--text-muted);margin-top:6px">${o.both} of ${o.n} questions comparable</div>
  </div>`}

  <div class="section-label">Maturity profile</div>
  <div class="card">
    <div class="card-note">${two ? esc(LBL_A()) + " versus " + esc(LBL_B()) : esc(SERIES[primary].lbl())}
      across ${cats.length} ${ui.level === "subject" ? "subjects" : "areas"}. The outer ring is 8, the top of the scale.</div>
    ${legendHTML(slots)}
    <div class="chart-wide"><div class="chart-host" data-chart="radar">${radarTooMany
      ? `<div class="empty"><div class="big">Too many points for a radar</div><div>${cats.length} categories. Select a single assessment area above to see its subject radar &mdash; all ${cats.length} are still plotted in the bar chart below.</div></div>`
      : ""}</div>${radarTooMany ? "" : radarKeyHTML(cats)}</div>
    ${radarTooMany ? "" : readoutHTML(cats, true, slots)}
  </div>

  <div class="section-label">${two ? "Score comparison" : "Scores"}</div>
  <div class="card">
    <div class="card-note">Lowest maturity first, so the weakest ${ui.level === "subject" ? "subjects" : "areas"} sit at the top.</div>
    ${legendHTML(slots)}
    <div class="chart-host" data-chart="bars"></div>
    ${readoutHTML(cats, true, slots)}
    <div class="qactions"><button class="minibtn" data-act="toggletable">${ui.showTable ? "Hide" : "Show"} table view</button></div>
    ${ui.showTable ? `<div class="tablewrap" style="margin-top:10px"><table class="dt">
      <thead><tr><th>${ui.level === "subject" ? "Subject" : "Area"}</th>${
        slots.map(k => `<th>${esc(SERIES[k].lbl(true))}</th>`).join("")}${two ? "<th>Gap</th>" : ""}<th>Q</th></tr></thead>
      <tbody>${sorted.map(c => `<tr><td>${esc(c.name)}</td>${
        slots.map(k => `<td><b>${fmt(c.st[k])}</b></td>`).join("")}${
        two ? `<td>${c.st.gap == null ? "\u2014" : (c.st.gap > 0 ? "+" : "") + fmt(c.st.gap)}</td>` : ""}<td>${c.st.n}</td></tr>`).join("")}
      <tr><td><b>${esc(scope)}</b></td>${slots.map(k => `<td><b>${fmt(o[k])}</b></td>`).join("")}${
        two ? `<td>${o.gap == null ? "\u2014" : (o.gap > 0 ? "+" : "") + fmt(o.gap)}</td>` : ""}<td>${o.n}</td></tr></tbody></table></div>` : ""}
  </div>

  ${!two ? "" : `
  <div class="section-label">${COMPARING() ? "Largest differences between the two" : "Largest self vs external gaps"}</div>
  <div class="card">
    ${gaps.length === 0
      ? `<div class="empty"><div class="big">No differences to show</div><div>${COMPARING()
          ? "The two assessments agree on every question scored in both."
          : "Score the same questions in both lanes to compare them."}</div></div>`
      : `<div class="card-note">Questions where the two assessments diverge most. Tap to open the question.</div>
         <div class="gaplist">${gaps.map(x => `<button class="gapitem" style="text-align:left;width:100%;background:none" data-goto="${x.aid}|${x.i}">
           <div class="txt"><div class="q">${esc(x.q)}</div><div class="a">${esc(x.area)} &middot; ${esc(x.subj)} &middot; ${esc(LBL_A(true))} ${x.s} / ${esc(LBL_B(true))} ${x.e}</div></div>
           ${gapChip(x.g)}
         </button>`).join("")}</div>`}
  </div>`}`;

  drawCharts(cats, sorted, radarTooMany, slots);
}

/* SVGs are generated at the container's measured pixel width, so their text
   renders 1:1 rather than being scaled by a viewBox. */
function drawCharts(cats, sorted, radarTooMany, slots) {
  document.querySelectorAll("#view-dash .chart-host").forEach(host => {
    const W = Math.max(240, host.clientWidth);
    if (host.dataset.chart === "radar") {
      if (!radarTooMany) host.innerHTML = radarSVG(cats, W, slots);
    } else {
      host.innerHTML = barsSVG(sorted, W, slots);
    }
  });
}

/*__MERGE_START__*/
/* ============================================================
   MERGE — combining assessments from several assessors

   Rules, as specified:
     • one side blank, other answered  → take the answer
     • both answered                   → average, and record both source
                                          scores in that question's notes
     • three or more answers           → mean of all of them (the running
                                          contribution list is re-averaged,
                                          so merge order never matters)
     • a score set by hand here        → wins over the average, but the
                                          contributions stay on record

   Notes never overwrite each other; each contributor's text is kept and
   attributed. The averaging working is derived, not written into the note
   text, so re-merging can't duplicate or corrupt what someone wrote.
   ============================================================ */

const norm = s => String(s == null ? "" : s).trim().toLowerCase().replace(/\s+/g, " ");

/* Where a value already exists with no recorded contributor — the workbook
   seed, or answers typed on this device — credit it before merging so the
   average includes it. */
function seedContribution(r, lane, who) {
  const key = SRC[lane], v = lane === "self" ? r.sa : r.ea;
  if (r[key] && r[key].length) return;
  if (v == null) { r[key] = []; return; }
  r[key] = [{ by: who, v: v }];
}

/* Every score stays a valid 1-8 level: an average that lands between levels is
   rounded DOWN, the cautious reading. The true mean is kept for the note. */
function recompute(r, lane) {
  const src = r[SRC[lane]] || [];
  const manual = lane === "self" ? r.saManual : r.eaManual;
  if (manual || !src.length) return;
  const mean = src.reduce((t, c) => t + c.v, 0) / src.length;
  const v = Math.floor(mean);
  if (lane === "self") { r.sa = v; r.saMean = mean; } else { r.ea = v; r.eaMean = mean; }
}

function appendNote(r, lane, text, who) {
  if (!text) return;
  const key = lane === "self" ? "sac" : "eac";
  const existing = r[key] || "";
  const stamped = who ? who + ": " + text : text;
  if (existing.includes(text)) return;              // idempotent on re-import
  r[key] = existing ? existing + "\n\n" + stamped : stamped;
}

/* Returns a summary of what the file contributed, for the audit trail. */
function mergeSubmission(incoming, filename) {
  const who = (incoming.assessor || "").trim() || "Unnamed assessor";
  const mine = (state.assessor || "").trim() || "This device";
  const out = { filled: 0, averaged: 0, agreed: 0, notes: 0, selfN: 0, extN: 0, skipped: 0 };

  Object.keys(incoming.responses || {}).forEach(k => {
    const their = incoming.responses[k];
    if (!their) return;
    const parts = k.split("|");
    const aid = parts[0], i = Number(parts[1]);
    if (!AREA_BY_ID[aid] || !AREA_BY_ID[aid].questions[i]) { out.skipped++; return; }

    if (!state.responses[k]) state.responses[k] = { sa: null, ea: null, sac: "", eac: "" };
    const r = state.responses[k];

    ["self", "external"].forEach(lane => {
      const tv = lane === "self" ? their.sa : their.ea;
      const tn = lane === "self" ? (their.sac || "") : (their.eac || "");

      if (tv != null) {
        if (lane === "self") out.selfN++; else out.extN++;
        seedContribution(r, lane, mine);
        const src = r[SRC[lane]];
        const already = src.some(c => c.by === who && c.v === tv);
        if (!already) {
          if (!src.length) out.filled++;
          else if (src.every(c => c.v === tv)) out.agreed++;
          else out.averaged++;
          src.push({ by: who, v: tv });
        }
        recompute(r, lane);
      }

      if (tn) { appendNote(r, lane, tn, who); out.notes++; }
    });
  });

  return out;
}

function mergeFiles(files, onDone) {
  undoSnapshot = JSON.stringify(state);        // one-step undo
  const results = [];
  let pending = files.length;

  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        const sub = parsed && parsed.state ? parsed.state : parsed;
        if (!sub || typeof sub.responses !== "object") throw new Error("not a CVM assessment export");

        const summary = mergeSubmission(sub, file.name);
        state.submissions.push({
          assessor: (sub.assessor || "").trim() || "Unnamed assessor",
          client: sub.client || "",
          title: sub.title || "",
          file: file.name,
          at: new Date().toISOString(),
          exported: parsed && parsed.exported ? parsed.exported : "",
          summary: summary
        });
        results.push({ file: file.name, ok: true, assessor: sub.assessor, summary });
      } catch (err) {
        results.push({ file: file.name, ok: false, error: err.message || "could not be read" });
      }
      if (--pending === 0) { save(); onDone(results); }
    };
    reader.onerror = () => {
      results.push({ file: file.name, ok: false, error: "could not be read" });
      if (--pending === 0) { save(); onDone(results); }
    };
    reader.readAsText(file);
  });
}

/* Read the labels off the chosen files before merging, so a submission from a
   different client or a different assessment can be queried rather than
   silently folded in. */
function inspectFiles(files, onDone) {
  const info = [];
  let pending = files.length;
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        const sub = parsed && parsed.state ? parsed.state : parsed;
        info.push({ file: file.name, client: sub.client || "", title: sub.title || "", assessor: sub.assessor || "" });
      } catch (e) { info.push({ file: file.name, unreadable: true }); }
      if (--pending === 0) onDone(info);
    };
    reader.onerror = () => { info.push({ file: file.name, unreadable: true }); if (--pending === 0) onDone(info); };
    reader.readAsText(file);
  });
}

function mismatchWarning(info) {
  const bad = info.filter(f => !f.unreadable &&
    (norm(f.client) !== norm(state.client) || norm(f.title) !== norm(state.title)));
  if (!bad.length) return null;
  const lines = bad.map(f => "• " + f.file + "\n    " +
    (f.client || "no client") + " — " + (f.title || "no title"));
  return "These submissions are labelled differently from this assessment:\n\n" +
    lines.join("\n") +
    "\n\nThis assessment is:\n    " + (state.client || "no client") + " — " + (state.title || "no title") +
    "\n\nMerge them anyway?";
}


/* ============================================================
   IMPORT REVIEW

   Nothing merges until it has been looked at. Each chosen file is read,
   its lane split counted, and its client/title checked against this
   assessment — then shown for confirmation.

   The lane override exists because the app cannot detect the one mistake
   it cannot recover from on its own: an assessor who was asked to complete
   the external assessment but left the switch on Self. Their scores are
   perfectly valid, just in the wrong lane, and only a human knows that.
   It is offered ONLY for files whose answers sit entirely in one lane —
   where a file has both, moving them would mean guessing which was which.
   ============================================================ */

let pendingImport = null;      // [{file, ok, sub, selfN, extN, lane, mismatch, error}]

function readFiles(files, onDone) {
  const out = [];
  let pending = files.length;
  files.forEach((file, idx) => {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        const sub = parsed && parsed.state ? parsed.state : parsed;
        if (!sub || typeof sub.responses !== "object") throw new Error("not a CVM assessment export");
        let selfN = 0, extN = 0;
        Object.keys(sub.responses).forEach(k => {
          const r = sub.responses[k];
          if (!r) return;
          if (r.sa != null) selfN++;
          if (r.ea != null) extN++;
        });
        out[idx] = {
          file: file.name, ok: true, sub: sub, selfN: selfN, extN: extN,
          lane: "asSaved",
          mismatch: norm(sub.client || "") !== norm(state.client) || norm(sub.title || "") !== norm(state.title)
        };
      } catch (err) {
        out[idx] = { file: file.name, ok: false, error: err.message || "could not be read" };
      }
      if (--pending === 0) onDone(out.filter(Boolean));
    };
    reader.onerror = () => {
      out[idx] = { file: file.name, ok: false, error: "could not be read" };
      if (--pending === 0) onDone(out.filter(Boolean));
    };
    reader.readAsText(file);
  });
}

/* Moves every answer and note from one lane to the other. Only ever called on
   submissions whose answers are entirely in a single lane. */
function swapLanes(sub, target) {
  const out = {};
  Object.keys(sub.responses).forEach(k => {
    const r = sub.responses[k] || {};
    const v = r.sa != null ? r.sa : r.ea;
    const n = r.sac || r.eac || "";
    out[k] = target === "self"
      ? { sa: v == null ? null : v, ea: null, sac: n, eac: "" }
      : { sa: null, ea: v == null ? null : v, sac: "", eac: n };
  });
  return Object.assign({}, sub, { responses: out });
}

const plural = (n, word) => n + " " + word + (n === 1 ? "" : "s");
const laneLabel = it => {
  if (it.selfN && it.extN) return it.selfN + " self, " + it.extN + " external";
  if (it.selfN) return plural(it.selfN, "self answer");
  if (it.extN) return plural(it.extN, "external answer");
  return "no answers";
};
const singleLane = it => (it.selfN > 0) !== (it.extN > 0);   // exactly one lane used

}

function showImportSheet() {
  const host = $("#sheetHost");
  host.innerHTML = importSheetHTML();
  host.hidden = false;
  document.body.classList.add("sheet-open");
}
function hideImportSheet() {
  const host = $("#sheetHost");
  host.hidden = true;
  host.innerHTML = "";
  document.body.classList.remove("sheet-open");
  pendingImport = null;
}

function runPendingImport() {
  const good = (pendingImport || []).filter(i => i.ok && (i.selfN + i.extN) > 0);
  if (!good.length) { hideImportSheet(); toast("Nothing to import"); return; }

  undoSnapshot = JSON.stringify(state);
  const results = [];
  good.forEach(it => {
    const sub = (it.lane === "asSaved") ? it.sub : swapLanes(it.sub, it.lane);
    const summary = mergeSubmission(sub, it.file);
    state.submissions.push({
      assessor: (sub.assessor || "").trim() || "Unnamed assessor",
      client: sub.client || "", title: sub.title || "",
      file: it.file, at: new Date().toISOString(),
      lane: it.lane, movedTo: it.lane === "asSaved" ? "" : it.lane,
      summary: summary
    });
    results.push(summary);
  });
  save();

  const filled = results.reduce((n, r) => n + r.filled, 0);
  const avgd = results.reduce((n, r) => n + r.averaged, 0);
  hideImportSheet();
  render();
  toast(good.length + " merged · " + filled + " added" + (avgd ? " · " + avgd + " averaged" : ""));
}

/* Display-only: these read provenance that is already in the file. They stay in
   every edition so a merged assessment still shows who scored what — but without
   the engine above, no edition except the consolidator can perform a merge. */
function contributorList() {
  const seen = new Map();
  (state.submissions || []).forEach(s => {
    const cur = seen.get(s.assessor) || { name: s.assessor, selfN: 0, extN: 0, files: 0 };
    cur.selfN += (s.summary && s.summary.selfN) || 0;
    cur.extN += (s.summary && s.summary.extN) || 0;
    cur.files += 1;
    seen.set(s.assessor, cur);
  });
  return [...seen.values()];
}
function averagedQuestions() {
  const out = [];
  DATA.areas.forEach(a => a.questions.forEach((q, i) => {
    ["self", "external"].forEach(lane => {
      if (isAveraged(a.id, i, lane)) out.push({ a, q, i, lane, src: srcOf(a.id, i, lane), v: val(a.id, i, lane) });
    });
  }));
  return out;
}

/* ============================================================
   SETUP / EXPORT
   ============================================================ */
/* What each of the two assessments actually contains — asked of the scores and
   the submission log, not of a setting. This is the answer to "have I got enough
   back from everybody yet", per assessment, which is the question a consolidator
   is always asking. */
function laneRollup(lane) {
  const key = lane === "self" ? "sa" : "ea";
  let scored = 0, averaged = 0;
  const who = new Map();
  DATA.areas.forEach(a => a.questions.forEach((q, i) => {
    if (val(a.id, i, lane) != null) scored++;
    const src = srcOf(a.id, i, lane);
    if (src.length > 1) averaged++;
    src.forEach(c => who.set(c.by || "unnamed", (who.get(c.by || "unnamed") || 0) + 1));
  }));
  return { lane, scored, averaged, total: TOTAL_Q, assessors: [...who.keys()], counts: who };
}

/* ---------- export ---------- */
function csvCell(v) {
  const s = v == null ? "" : String(v);
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
/* The notes columns carry the assessor's text plus, where a score came from more
   than one assessor, the working: who scored what and the resulting average. */
function notesFor(aid, i, lane) {
  return [cmt(aid, i, lane), mergeNote(aid, i, lane)].filter(Boolean).join(" | ");
}
function buildCSV() {
  /* A locked edition exports its own assessment. Columns headed for the other one,
     with nothing under them, invite the reader to conclude it scored zero. */
  const lanes = SOLO_UI() ? [FIXED_LANE] : ["self", "external"];
  const label = lane => lane === "self" ? LBL_A() : LBL_B();
  const head = ["Client", "Assessment Title", SOLO_UI() ? "Assessor" : "Consolidated By",
                "Assessment Area", "Assessment Subject", "Question"];
  lanes.forEach(l => head.push(label(l)));
  if (!SOLO_UI()) head.push("Gap (" + LBL_B(true) + " - " + LBL_A(true) + ")");
  lanes.forEach(l => head.push(label(l) + " Comments"));
  lanes.forEach(l => head.push(label(l) + " Assessors"));
  const rows = [head];

  DATA.areas.forEach(a => a.questions.forEach((q, i) => {
    const v = lane => val(a.id, i, lane);
    const who = lane => srcOf(a.id, i, lane).map(c => c.by + " " + c.v).join("; ");
    const row = [state.client, state.title, state.assessor, a.name, q.subject, q.q];
    lanes.forEach(l => row.push(v(l) == null ? "" : v(l)));
    if (!SOLO_UI()) {
      const s = v("self"), e = v("external");
      row.push((s != null && e != null) ? Math.round((e - s) * 10) / 10 : "");
    }
    lanes.forEach(l => row.push(notesFor(a.id, i, l)));
    lanes.forEach(l => row.push(who(l)));
    rows.push(row);
  }));
  return "﻿" + rows.map(r => r.map(csvCell).join(",")).join("\r\n");
}
/* What a locked edition puts in its file: its own assessment. Scores for the other
   side can only have arrived by restoring somebody else's backup into this copy,
   and passing them on would credit this assessor with answers they never gave —
   the consolidator would merge them, in their name, into an assessment they were
   not asked to do. The other side's data stays on the device; it just does not
   travel. Any other edition exports its state as it stands. */
function exportState() {
  if (!SOLO_UI()) return state;
  const keep = FIXED_LANE === "self";
  const out = Object.assign({}, state, { responses: {} });
  Object.keys(state.responses).forEach(k => {
    const r = state.responses[k] || {};
    const mine = keep
      ? { sa: r.sa, ea: null, sac: r.sac || "", eac: "", saSrc: r.saSrc, saMean: r.saMean, saManual: r.saManual }
      : { sa: null, ea: r.ea, sac: "", eac: r.eac || "", eaSrc: r.eaSrc, eaMean: r.eaMean, eaManual: r.eaManual };
    if (mine.sa != null || mine.ea != null || mine.sac || mine.eac) out.responses[k] = mine;
  });
  return out;
}

/* Empty fields are dropped rather than slugged to a placeholder word. */
function nameParts(prefix) {
  const parts = [prefix];
  if (FIXED_LANE) parts.push(FIXED_LANE);
  if (state.client) parts.push(slug(state.client));
  if (state.title) parts.push(slug(state.title));
  parts.push(stamp());
  return parts.join("-");
}
function reportName(ext) { return nameParts("cvm") + "." + ext; }

/* A submission file carries the assessor's name. Several contributors export the
   same assessment on the same day, so without it every file lands in the
   consolidator's download folder under one name and they are told apart only by
   the "(1)", "(2)" the operating system adds. */
function submissionName() {
  const parts = [nameParts("cvm")];
  if (state.assessor) parts.push(slug(state.assessor));
  return parts.join("-") + ".json";
}
function slug(s) { return (s || "assessment").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "assessment"; }
function stamp() { const d = new Date(); const p = n => String(n).padStart(2, "0"); return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()); }
const INSTALLED = (() => {
  try {
    return window.navigator.standalone === true ||
           (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
  } catch (e) { return false; }
})();
const NATIVE = (() => {
  try { return !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.cvmExport); }
  catch (e) { return false; }
})();

/* ---------- installing, per platform ----------
   Only iOS restricts this to one browser: no browser on an iPhone may install a
   web app except Safari, because every iOS browser is Safari's engine wearing a
   different badge and only Safari exposes Add to Home Screen. Everywhere else —
   Windows, macOS, Android, ChromeOS — Chrome and Edge install it in one click,
   and this app runs identically in any modern browser whether it is installed or
   not. Telling a Windows user to open Safari would be nonsense. */
const UA = (() => { try { return navigator.userAgent || ""; } catch (e) { return ""; } })();
const IS_IOS = (() => {
  try {
    return /iPad|iPhone|iPod/.test(UA) ||
           (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);   // iPadOS reports as a Mac
  } catch (e) { return false; }
})();
const IS_ANDROID = /Android/.test(UA);

/* Chrome and Edge offer the install themselves through this event; when they do,
   the app can put a real button in front of the person instead of describing a
   menu they would have to go and find. */
let installPrompt = null;
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  installPrompt = e;
  if (ui.tab === "more") render(true);
});
window.addEventListener("appinstalled", () => { installPrompt = null; if (ui.tab === "more") render(true); });

function installStepsHTML() {
  if (IS_IOS) {
    return `<ol>
      <li>Open this page in <b>Safari</b>. On an iPhone or iPad this is the only browser that can
        install a web app &mdash; not a preference, an Apple restriction.</li>
      <li>Tap <b>Share</b>, then <b>Add to Home Screen</b>.</li>
      <li>Launch it from the icon &mdash; full screen, no browser bar, works with no signal.</li>
    </ol>`;
  }
  if (IS_ANDROID) {
    return `<ol>
      <li>In <b>Chrome</b>, open the <b>\u22ee</b> menu.</li>
      <li>Tap <b>Install app</b> (or <b>Add to Home screen</b>).</li>
      <li>Launch it from the icon &mdash; full screen, works with no signal.</li>
    </ol>`;
  }

    <li>In <b>Chrome</b> or <b>Edge</b>, click the <b>install icon</b> at the right-hand end of the
      address bar &mdash; or the <b>\u22ee</b> menu, then <b>Cast, save and share \u203a Install page as app</b>.</li>
    <li>It opens in its own window, keeps its own icon, and works with no network.</li>
    <li>Firefox has no install button; the app still runs perfectly as an ordinary page.</li>
  </ol>`;
}
function haptic(kind) {
  try { window.webkit.messageHandlers.cvmHaptic.postMessage(kind || "light"); } catch (e) { /* web: no-op */ }
}
async function download(text, filename, mime) {
  if (NATIVE) {
    try {
      window.webkit.messageHandlers.cvmExport.postMessage({ name: filename, mime: mime, text: text });
      return;
    } catch (e) { /* fall through to web paths */ }
  }
  const blob = new Blob([text], { type: mime });
  try {
    const file = new File([blob], filename, { type: mime });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: filename });
      return;
    }
  } catch (e) { if (e && e.name === "AbortError") return; }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.rel = "noopener";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast("Saved " + filename);
}

/* ============================================================
   CLIENT REPORT

   Builds a standalone, print-ready HTML document and turns it into a PDF.
   The charts are the same radar and bar code used on the Dashboard, rendered
   with literal hex colours instead of CSS variables, because the report is a
   separate document with its own stylesheet and is always light-themed —
   a dark-mode PDF would be wrong on paper.

   Native app  → handed to Swift, which renders it with WKWebView.createPDF
                 and opens the share sheet.
   Browser/PWA → opened in a new window and printed (Save as PDF).
   ============================================================ */

const REPORT_PALETTE = {
  s1: "#2a78d6", s2: "#eb6834",
  grid: "#e2e0da", ink: "#0b0b0b", ink2: "#52514e", ink3: "#7b7a74",
  surface: "#ffffff", good: "#0ca30c", bad: "#d03b3b"
};

/* The chart builders emit var(--…) references; for the report those become
   literal colours so the SVG stands alone. */
function literalise(svg) {
  const map = {
    "var(--series-1)": REPORT_PALETTE.s1,
    "var(--series-2)": REPORT_PALETTE.s2,
    "var(--grid)": REPORT_PALETTE.grid,
    "var(--text-primary)": REPORT_PALETTE.ink,
    "var(--text-secondary)": REPORT_PALETTE.ink2,
    "var(--text-muted)": REPORT_PALETTE.ink3,
    "var(--surface-1)": REPORT_PALETTE.surface,
    "var(--surface-0)": "#f4f3f0"
  };
  return Object.keys(map).reduce((out, k) => out.split(k).join(map[k]), svg);
}

function reportDate() {
  const d = new Date();
  return d.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
}

function reportStats() {
  const sa = [], ea = [];
  let both = 0;
  DATA.areas.forEach(a => a.questions.forEach((q, i) => {
    const s = val(a.id, i, "self"), e = val(a.id, i, "external");
    if (s != null) sa.push(s);
    if (e != null) ea.push(e);
    if (s != null && e != null) both++;
  }));
  const avg = x => x.length ? x.reduce((p, c) => p + c, 0) / x.length : null;
  const oSa = avg(sa), oEa = avg(ea);
  return { saN: sa.length, eaN: ea.length, both, sa: oSa, ea: oEa,
           gap: (oSa != null && oEa != null) ? oEa - oSa : null };
}

function levelFor(v) {
  if (v == null) return "—";
  const i = Math.max(1, Math.min(8, Math.round(v)));
  return LEVELS[i - 1][0];
}

function gapCell(g) {
  if (g == null) return '<td class="num">—</td>';
  const r = Math.round(g * 10) / 10;
  if (Math.abs(r) < 0.05) return '<td class="num">0.0</td>';
  const cls = r > 0 ? "up" : "down";
  return `<td class="num ${cls}">${r > 0 ? "+" : ""}${r.toFixed(1)}</td>`;
}

function buildReportHTML() {
  forgetLanes();
  const o = reportStats();
  /* The report shows what the assessment holds, named the same way the dashboard
     names it: one series and its title where one assessment was done, both
     series and a gap column where there are two to compare. A column headed
     "External" with nothing under it is not a finding, it is an unfinished
     document. */
  const slots = dashSlots();
  const two = slots.length > 1;
  const primary = slots[0];
  const th = (abbr) => slots.map(k => `<th class="num">${esc(SERIES[k].lbl(abbr))}</th>`).join("");
  const legend = `<div class="legend">${slots.map(k =>

  const cells = st => slots.map(k => `<td class="num">${fmt(st[k])}</td>`).join("");
  const areaCats = DATA.areas.map(a => ({ key: a.id, name: a.name, area: a.name, aid: a.id, st: areaStats(a) }));
  const byWeakest = areaCats.slice().sort((x, y) =>
    (x.st[primary] == null ? 99 : x.st[primary]) - (y.st[primary] == null ? 99 : y.st[primary]));

  // charts: fixed widths that suit A4 at ~96dpi with 18mm margins
  const savedPick = ui.pick;

  const bars = literalise(barsSVG(byWeakest, 660, slots));
  REPORT_MODE = false;

  const gaps = [];

  gaps.sort((x, y) => Math.abs(y.g) - Math.abs(x.g));
  const topGaps = gaps.slice(0, 15);

  const contributors = contributorList();

  const subjectSections = DATA.areas.map(a => {

      .sort((x, y) => (x.st[primary] == null ? 99 : x.st[primary]) - (y.st[primary] == null ? 99 : y.st[primary]));
    const st = areaStats(a);
    return `<section class="area-block">

        &middot; ${st.n} questions</p>

        <tbody>${subs.map(sx => `<tr>
          <td>${esc(sx.name)}</td>
          ${cells(sx.st)}

      </table>
    </section>`;
  }).join("");

  const appendix = !ui.reportAppendix ? "" : `

        <h3>${esc(a.name)}</h3>
        <table class="qtable">

          <tbody>${a.questions.map((q, i) => {
            const notes = [notesFor(a.id, i, "self"), notesFor(a.id, i, "external")].filter(Boolean).join(" — ");
            return `<tr>
              <td><span class="subj">${esc(q.subject)}</span>${esc(q.q)}</td>
              ${slots.map(k => { const v = val(a.id, i, k === "sa" ? "self" : "external");
                return `<td class="num">${v == null ? "\u2014" : v}</td>`; }).join("")}
              <td class="notes">${esc(notes)}</td></tr>`;
          }).join("")}</tbody>
        </table>`).join("")}
    </section>`;

  return `<!DOCTYPE html>
