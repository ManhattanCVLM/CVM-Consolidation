  table { width:100%; border-collapse:collapse; font-size:9.5pt; margin-bottom:6pt; }
  th, td { text-align:left; padding:4.5pt 5pt; border-bottom:.75px solid ${REPORT_PALETTE.grid}; vertical-align:top; }
  th { font-size:8pt; letter-spacing:.05em; text-transform:uppercase; color:${REPORT_PALETTE.ink3}; font-weight:700;
       border-bottom:1px solid ${REPORT_PALETTE.ink3}; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  td.num.up { color:${REPORT_PALETTE.good}; font-weight:700; }
  td.num.down { color:${REPORT_PALETTE.bad}; font-weight:700; }
  thead { display:table-header-group; }
  tr { page-break-inside:avoid; }
  .legend { display:flex; gap:16pt; font-size:9pt; color:${REPORT_PALETTE.ink2}; margin:0 0 8pt; }
  .legend span { display:inline-flex; align-items:center; gap:5pt; }
  .legend i { width:9pt; height:9pt; border-radius:2pt; display:inline-block; }
  .chart { text-align:center; margin:6pt 0 4pt; page-break-inside:avoid; }
  .chart svg { max-width:100%; height:auto; }
  .rkey { list-style:none; padding:0; margin:6pt 0 0; column-count:2; column-gap:20pt; font-size:9pt; color:${REPORT_PALETTE.ink2}; }
  .rkey li { margin-bottom:2.5pt; }
  .rkey b { color:${REPORT_PALETTE.ink3}; display:inline-block; min-width:12pt; }
  .area-block { page-break-inside:avoid; margin-bottom:12pt; }
  .qtable td:first-child { width:52%; }
  .qtable .subj { display:block; font-size:7.5pt; letter-spacing:.04em; text-transform:uppercase; color:${REPORT_PALETTE.ink3}; }
  .qtable .notes { font-size:8.5pt; color:${REPORT_PALETTE.ink2}; }
  .foot { font-size:8pt; color:${REPORT_PALETTE.ink3}; border-top:.75px solid ${REPORT_PALETTE.grid}; padding-top:6pt; margin-top:14pt; }
  ul.plain { margin:0 0 8pt; padding-left:14pt; }
  ul.plain li { margin-bottom:3pt; }
</style></head>
<body>

<div class="cover">
  ${LOGO ? `<img class="brand" src="${LOGO}" alt="Manhattan CVLM">` : ""}
  <div class="kicker">Contract Value Management${COMPARING() ? " \u00b7 Comparison" : ""}</div>
  <h1>${esc(COMPARING() ? (LBL_A() + " vs " + LBL_B()) : (state.title || "Maturity Assessment"))}</h1>
  <div class="client">${esc(state.client || "")}</div>
  <dl>
    <dt>Report date</dt><dd>${reportDate()}</dd>
    <dt>${COMPARING() ? "Assessments compared" : "Questions assessed"}</dt>
    <dd>${COMPARING() ? `${esc(LBL_A())} and ${esc(LBL_B())}, ${o.both} questions in both`
        : two ? `${o.saN} self, ${o.eaN} external, of ${TOTAL_Q}`
        : `${primary === "sa" ? o.saN : o.eaN} of ${TOTAL_Q} \u00b7 ${esc(laneName(primary === "sa" ? "self" : "external"))}`}</dd>
    <dt>Contributors</dt><dd>${contributors.length ? contributors.map(c => esc(c.name)).join(", ") : esc(state.assessor || "—")}</dd>
    <dt>Consolidated by</dt><dd>${esc(state.assessor || "—")}</dd>
  </dl>
</div>

<section class="page-break">
  <h2>Executive summary</h2>
  <div class="kpis">
    ${slots.map(k => `<div class="kpi"><div class="l"><i style="background:${k === "sa" ? REPORT_PALETTE.s1 : REPORT_PALETTE.s2}"></i>${esc(SERIES[k].lbl())}</div>
      <div class="v">${fmt(o[k])}<small> / 8</small></div><div class="c">${levelFor(o[k])}</div></div>`).join("")}
    ${!two ? `<div class="kpi"><div class="l">Questions scored</div>
      <div class="v">${primary === "sa" ? o.saN : o.eaN}<small> / ${TOTAL_Q}</small></div>
      <div class="c">${Math.round(((primary === "sa" ? o.saN : o.eaN) / TOTAL_Q) * 100)}% complete</div></div>`
    : `<div class="kpi"><div class="l">Alignment</div>
      <div class="v">${o.gap == null ? "\u2014" : (o.gap > 0 ? "+" : "") + fmt(o.gap)}</div>
      <div class="c">${o.both} of ${TOTAL_Q} comparable</div></div>`}
  </div>
  <p>${!two
      ? `Overall maturity sits at <b>${fmt(o[primary])} of 8</b> (${levelFor(o[primary])}), across the ${
          primary === "sa" ? o.saN : o.eaN} question${(primary === "sa" ? o.saN : o.eaN) === 1 ? "" : "s"} scored in
          ${esc(SERIES[primary].lbl())}.`
      : o.gap == null
      ? "Only one of the two assessments has been completed, so no comparison is available yet."
      : COMPARING()
        /* Two assessments of the same kind held against each other. The
           self-versus-external reading — over-confidence, under-recognised
           capability — says nothing here and would be actively wrong in an
           edition where both sides are self assessments. */
        ? (Math.abs(o.gap) < 0.25
          ? `<b>${esc(LBL_A())}</b> and <b>${esc(LBL_B())}</b> are level overall, both at about <b>${fmt(o.sa)} of 8</b> (${levelFor(o.sa)}). Where the totals match, the movement is in the detail: see the largest divergences below.`
          : o.gap < 0
            ? `<b>${esc(LBL_B())}</b> scores <b>${fmt(o.ea)} of 8</b> against <b>${fmt(o.sa)}</b> for <b>${esc(LBL_A())}</b> — <b>${fmt(Math.abs(o.gap))} points lower</b>. Maturity assessed as lower than before is worth reading question by question: it can be genuine slippage, or a later assessment applying the evidence bar more strictly.`
            : `<b>${esc(LBL_B())}</b> scores <b>${fmt(o.ea)} of 8</b> against <b>${fmt(o.sa)}</b> for <b>${esc(LBL_A())}</b> — <b>${fmt(o.gap)} points higher</b>. The areas carrying that improvement are listed below, alongside the ones that have not moved.`)
      : Math.abs(o.gap) < 0.25
        ? `Overall maturity sits at <b>${fmt(o.sa)} of 8</b> (${levelFor(o.sa)}). The self and external assessments broadly agree, which suggests the organisation has a realistic view of its own capability.`
        : o.gap < 0
          ? `Overall maturity sits at <b>${fmt(o.ea)} of 8</b> on the external assessment against <b>${fmt(o.sa)}</b> self-assessed. The external view is <b>${fmt(Math.abs(o.gap))} points lower</b>, indicating the organisation rates itself above the evidence available — the gap itself is a finding, since remediation plans built on the self-assessment would start from an optimistic baseline.`
          : `Overall maturity sits at <b>${fmt(o.ea)} of 8</b> on the external assessment against <b>${fmt(o.sa)}</b> self-assessed. The external view is <b>${fmt(o.gap)} points higher</b>, indicating capability that exists but is under-recognised internally — often a sign that good practice is present but not documented or credited.`}</p>
  <p><b>Weakest areas.</b> ${byWeakest.slice(0, 3).map(c => esc(c.name) + " (" + fmt(c.st[primary]) + ")").join(", ")}
    score lowest on ${esc(SERIES[primary].lbl())} and are the natural focus for improvement.</p>
  ${averaged.length ? `<p><b>Consolidation.</b> ${contributors.length} assessors contributed. ${averaged.length} question${averaged.length === 1 ? " was" : "s were"} answered by more than one assessor; those scores are the average of the contributions, rounded down to the nearest level. The contributing scores are recorded against each question.</p>` : ""}
</section>

<section class="page-break avoid-break">
  <h2>Maturity profile</h2>
  <p class="lead">${two ? esc(LBL_A()) + " versus " + esc(LBL_B()) : esc(SERIES[primary].lbl())} across the
    ${DATA.areas.length} assessment areas. The outer ring is 8, the top of the scale.</p>
  ${legend}
  <div class="avoid-break">
    <div class="chart">${radar}</div>
    <ol class="rkey">${radarKey}</ol>
  </div>
</section>

<section class="page-break">
  <h2>Scores by assessment area</h2>
  <p class="lead">Lowest maturity first.</p>
  ${legend}
  <div class="chart">${bars}</div>
  <table>
    <thead><tr><th>Assessment area</th>${th(true)}${two ? '<th class="num">Gap</th>' : ""}<th class="num">Questions</th></tr></thead>
    <tbody>
      ${byWeakest.map(c => `<tr><td>${esc(c.name)}</td>${cells(c.st)}${two ? gapCell(c.st.gap) : ""}<td class="num">${c.st.n}</td></tr>`).join("")}
      <tr><td><b>All areas</b></td>${slots.map(k => `<td class="num"><b>${fmt(o[k])}</b></td>`).join("")}${two ? gapCell(o.gap) : ""}<td class="num"><b>${TOTAL_Q}</b></td></tr>
    </tbody>
  </table>
</section>

<section class="page-break">
  <h2>Detail by subject</h2>
  <p class="lead">Every subject within each assessment area, weakest first.</p>
  ${subjectSections}
</section>

${topGaps.length ? `<section class="page-break">
  <h2>Largest divergences</h2>
  <p class="lead">Questions where ${esc(LBL_A())} and ${esc(LBL_B())} differ most.${COMPARING()
    ? " This is where the change between them actually happened." : " These are the conversations worth having first."}</p>
  <table>
    <thead><tr><th>Question</th>${th(true)}<th class="num">Gap</th></tr></thead>
    <tbody>${topGaps.map(x => `<tr>
      <td><span class="subj" style="display:block;font-size:7.5pt;letter-spacing:.04em;text-transform:uppercase;color:${REPORT_PALETTE.ink3}">${esc(x.area)} &middot; ${esc(x.subj)}</span>${esc(x.q)}</td>
      <td class="num">${x.s}</td><td class="num">${x.e}</td>${gapCell(x.g)}</tr>`).join("")}</tbody>
  </table>
</section>` : ""}

<section${ui.reportAppendix ? "" : ' class="page-break"'}>
  <h2>Method and scale</h2>
  <p class="lead">How to read the scores in this report.</p>
  <table>
    <thead><tr><th class="num">Level</th><th>Name</th><th>Meaning</th></tr></thead>
    <tbody>${LEVELS.map((L, i) => `<tr><td class="num">${i + 1}</td><td><b>${esc(L[0])}</b></td><td>${esc(L[1])}</td></tr>`).join("")}</tbody>
  </table>
  <h3>Consolidation</h3>
  <ul class="plain">
    <li>Each question is answered once per assessment by a single assessor; unanswered questions are filled from whichever contributor completed them.</li>
    <li>Where two or more assessors answered the same question, the consolidated score is the mean of their scores, rounded down to the nearest whole level.</li>
    <li>Area and subject figures are the unweighted mean of the question scores within them, so areas with more questions carry proportionally more detail but no extra weight.</li>
    ${two ? "<li>Only questions answered in both assessments contribute to a gap figure.</li>" : ""}
    ${COMPARING() ? "<li>The two assessments compared here are named by their own titles throughout; neither is treated as the baseline for the other.</li>" : ""}
  </ul>
  ${contributors.length ? `<h3>Contributors</h3>
  <table>
    <thead><tr><th>Assessor</th>${slots.map(k => `<th class="num">${esc(SERIES[k].lbl(true))} answers</th>`).join("")}</tr></thead>
    <tbody>${contributors.map(c => `<tr><td>${esc(c.name)}</td>${
      slots.map(k => `<td class="num">${k === "sa" ? c.selfN : c.extN}</td>`).join("")}</tr>`).join("")}</tbody>
  </table>` : ""}
  <div class="foot">
    ${LOGO ? `<img class="brand-sm" src="${LOGO}" alt="Manhattan CVLM">` : ""}
    ${esc(state.client || "")}${state.title ? " &middot; " + esc(state.title) : ""} &middot; ${reportDate()} &middot;
    ${TOTAL_Q} questions across ${DATA.areas.length} assessment areas &middot; generated by CVM Assessment build ${BUILD}
  </div>
</section>

${appendix}
</body></html>`;
}

/* ---------- delivery ---------- */
function makeReport() {
  if (!state.client && !state.title) {
    if (!confirm("This report has no client name or title set — it will be hard to identify.\n\nCreate it anyway?")) {
      ui.tab = "more"; render(); return;
    }
  }
  const html = buildReportHTML();
  const name = nameParts("cvm-report") + ".pdf";

  // Native app: Swift renders a real PDF and opens the share sheet.
  try {
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.cvmPdf) {
      window.webkit.messageHandlers.cvmPdf.postMessage({ name: name, html: html });
      toast("Building PDF…");
      return;
    }
  } catch (e) { /* fall through */ }

  // Browser / installed web app: open and print, so the user can Save as PDF.
  const w = window.open("", "_blank");
  if (!w) {
    // Popup blocked — hand over the HTML file instead; it prints from any browser.
    download(html, name.replace(/\.pdf$/, ".html"), "text/html;charset=utf-8");
    toast("Report saved — open it and print to PDF");
    return;
  }
  w.document.open();
  w.document.write(html);
  w.document.close();
  w.focus();
  setTimeout(() => { try { w.print(); } catch (e) { /* user can print manually */ } }, 600);
}

/* ============================================================
   RENDER + EVENTS
   ============================================================ */
function chrome() {
  const inArea = ui.tab === "assess" && ui.area, inDashArea = false;
  $("#backBtn").hidden = !(inArea || inDashArea);
  $("#fabrow").hidden = !inArea;
  licBar();
  document.body.classList.toggle("has-fab", !!inArea);
  const t = $("#title"), s = $("#subtitle");
  if (inArea) { t.textContent = AREA_BY_ID[ui.area].name; s.textContent = laneName(state.lane) + " · " + (state.client || "no client"); }
  else if (inDashArea) { t.textContent = AREA_BY_ID[ui.dashArea].name; s.textContent = "Self vs external by subject"; }
  else if (ui.tab === "dash") { t.textContent = "Dashboard"; s.textContent = state.client || "Comparison analysis"; }
  else if (ui.tab === "more") { t.textContent = "Setup"; s.textContent = "Details, export, scale"; }
  else { t.textContent = "CVM Maturity"; s.textContent = FIXED_LANE ? laneName(FIXED_LANE) : "Contract Value Management assessment"; }
  document.querySelectorAll("#tabbar button").forEach(b => {
    if (b.dataset.tab === ui.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
  ["assess", "dash", "more"].forEach(k => { $("#view-" + k).hidden = ui.tab !== k; });
}
/* Shown when the licence has run out, and for the fortnight before it. Silent
   otherwise: an app that reminds you it is licensed on every screen for a year
   is nagging, not informing. */
function licBar() {
  const el = $("#licbar");
  if (!el) return;
  if (!LICENSED || (!LIC.unlicensed && (!LIC.expires || (LIC.daysLeft != null && LIC.daysLeft > 14)))) {
    el.hidden = true; el.innerHTML = ""; return;
  }
  el.hidden = false;
  if (LIC.unlicensed) {
    el.innerHTML = `<div class="licnote stop">
      <strong>This assessment needs a licence</strong>
      ${LIC.source === "bad-key"
        ? `The key on this device could not be verified. It may have been mistyped or altered in transit \u2014 ask
           ${esc(LIC_CONTACT)} to send it again.`
        : `Contact ${esc(LIC_CONTACT)} to obtain a licence key, then enter it under <b>Setup &#8250; Licence</b>.
           You can read the questions in the meantime; scoring starts once the key is in.`}
      <div class="licrow"><button class="minibtn" data-act="tolicence">Enter a licence key</button></div>
    </div>`;
  } else if (LIC.expired) {
    el.innerHTML = `<div class="licnote stop">
      <strong>This assessment's licence ended on ${esc(niceDate(LIC.expires))}</strong>
      Your answers are safe and can still be exported or reported on \u2014 scoring is switched off.
      Contact ${esc(LIC_CONTACT)} to renew, then paste the new key under <b>Setup &#8250; Licence</b>.
      <div class="licrow"><button class="minibtn" data-act="tolicence">Enter a new key</button>
        <button class="minibtn" data-act="json">Export my assessment</button></div>
    </div>`;
  } else {
    el.innerHTML = `<div class="licnote warn">
      <strong>Licence ends ${LIC.daysLeft === 0 ? "today" : "in " + LIC.daysLeft + " day" + (LIC.daysLeft === 1 ? "" : "s")}
        \u2014 ${esc(niceDate(LIC.expires))}</strong>
      After that you can still read and export this assessment, but not add to it.
      Contact ${esc(LIC_CONTACT)} if you need longer.
    </div>`;
  }
}
const niceDate = iso => {
  try { return new Date(iso + "T00:00:00Z").toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric", timeZone: "UTC" }); }
  catch (e) { return iso; }
};

function render(keepScroll) {
  const y = window.scrollY;
  forgetLanes();          // labels are named for the data, so re-read it
  // chrome() first: it unhides the target view, so charts can measure a real
  // container width instead of 0 (a hidden element has no layout).
  chrome();
  if (ui.tab === "assess") renderAssess();
  else if (ui.tab === "dash") renderDash();
  else renderMore();
  if (keepScroll) window.scrollTo(0, y); else window.scrollTo(0, 0);
}

/* theme */
function applyTheme() {
  document.documentElement.setAttribute("data-theme", state.theme);
  const icons = {
    auto: '<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 000 16z" fill="currentColor" stroke="none"/></svg>',
    light: '<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6"/></svg>',
    dark: '<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.2 8.2 0 019.5 4 8.4 8.4 0 1020 14.5z"/></svg>'
  };
  $("#themeBtn").innerHTML = icons[state.theme] || icons.auto;
  $("#themeBtn").title = "Appearance: " + state.theme;
  $("#themeBtn").setAttribute("aria-label", "Appearance: " + state.theme + ". Tap to change.");
}
$("#themeBtn").addEventListener("click", () => {
  state.theme = state.theme === "auto" ? "light" : state.theme === "light" ? "dark" : "auto";
  applyTheme(); save(); toast("Appearance: " + state.theme);
});

$("#tabbar").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]"); if (!b) return;
  ui.tab = b.dataset.tab; render();
});
$("#backBtn").addEventListener("click", () => {
  if (ui.tab === "assess") { ui.area = null; ui.query = ""; ui.filter = "all"; }
  else ui.dashArea = null;
  render();
});

function gotoQuestion(aid, i) {
  ui.tab = "assess"; ui.area = aid; ui.filter = "all"; ui.query = "";
  const q = AREA_BY_ID[aid].questions[i];
  ui.open[aid + "::" + q.subject] = true;
  render();
  requestAnimationFrame(() => {
    const el = document.getElementById("q-" + aid + "-" + i);
    if (el) { el.scrollIntoView({ block: "center", behavior: "smooth" }); el.style.outline = "2px solid var(--accent)"; el.style.outlineOffset = "2px"; setTimeout(() => { el.style.outline = ""; }, 1600); }
  });
}

document.querySelector("main").addEventListener("click", e => {
  const t = e.target;

  if (t.closest("[data-gotolane]")) { ui.tab = "more"; render(); toast("Assessment type is set here"); return; }
  const setLane = t.closest("[data-setlane]");
  if (setLane) {
    state.lane = setLane.dataset.setlane;
    ui.pick = null; save(); render(true);
    toast("Moderating the " + (state.lane === "self" ? "self" : "external") + " assessment");
    return;
  }

  const cmpLoad = t.closest("[data-cmpload]");
  if (cmpLoad && LOCKED()) { toast(LIC.unlicensed ? "A licence key is needed first" : "Licence ended \u2014 nothing new can be loaded"); return; }
  if (cmpLoad) { cmpSlot = cmpLoad.dataset.cmpload; $("#cmpIn").click(); return; }

  const cmpClear = t.closest("[data-cmpclear]");
  if (cmpClear) {
    const slot = cmpClear.dataset.cmpclear;
    const target = slot === "A" ? "sa" : "ea", noteKey = slot === "A" ? "sac" : "eac";
    Object.keys(state.responses).forEach(k => { const r = state.responses[k]; if (r) { r[target] = null; r[noteKey] = ""; } });
    if (slot === "A") state.cmpA = null; else state.cmpB = null;
    save(); render(); toast("Assessment " + slot + " cleared"); return;
  }

  const arow = t.closest("[data-area]");
  if (arow) { ui.area = arow.dataset.area; ui.filter = "all"; ui.query = ""; render(); return; }

  const slice = t.closest("[data-slice]");
  if (slice) {
    const id = slice.dataset.slice;
    if (id === "__clear") ui.areaFilter = [];
    else {
      const set = new Set(ui.areaFilter || []);
      set.has(id) ? set.delete(id) : set.add(id);
      ui.areaFilter = [...set];
    }
    ui.pick = null; haptic("light"); render(true); return;
  }

  const lvl = t.closest("[data-level]");
  if (lvl) { ui.level = lvl.dataset.level; ui.pick = null; haptic("light"); render(true); return; }

  const drill = t.closest("[data-drill]");
  if (drill) { ui.areaFilter = [drill.dataset.drill]; ui.level = "subject"; ui.pick = null; haptic("light"); render(); return; }

  const oa = t.closest("[data-openarea]");
  if (oa) { ui.tab = "assess"; ui.area = oa.dataset.openarea; render(); return; }

  const cat = t.closest("[data-cat]");
  if (cat) {
    const k = cat.dataset.cat;
    ui.pick = ui.pick === k ? null : k;
    haptic("light"); render(true); return;
  }

  const openA = t.closest("[data-open-area]");
  if (openA) { ui.tab = "assess"; ui.area = openA.dataset.openArea; ui.dashArea = null; render(); return; }

  const goto = t.closest("[data-goto]");
  if (goto) { const [aid, i] = goto.dataset.goto.split("|"); gotoQuestion(aid, +i); return; }

  const subj = t.closest("[data-subj]");
  if (subj) {
    const k = subj.dataset.subj; ui.open[k] = !ui.open[k];
    subj.setAttribute("aria-expanded", String(!!ui.open[k]));
    subj.parentElement.querySelector(".subjbody").hidden = !ui.open[k];
    return;
  }

  const f = t.closest("[data-filter]");
  if (f) { ui.filter = f.dataset.filter; render(true); return; }

  if (t.closest("#qclear")) { ui.query = ""; render(true); return; }

  const sc = t.closest("[data-score]");
  if (sc) {
    if (LOCKED()) { toast(LIC.unlicensed ? "A licence key is needed before scoring" : "Licence ended \u2014 scoring is switched off"); return; }
    if (advancing()) return;                       // the page is still moving; that tap was meant for elsewhere
    const card = sc.closest(".qcard"), [aid, i] = card.dataset.q.split("|");
    const n = +sc.dataset.score, cur = val(aid, +i, state.lane);
    setScore(aid, +i, state.lane, n === cur ? null : n);
    haptic(n === cur ? "soft" : "light");
    refreshCard(card, aid, +i);
    /* Only on the first score for this question: changing one must not move the page. */
    if (cur == null && n !== cur) advanceFrom(document.querySelector(`.qcard[data-q="${aid}|${i}"]`));
    return;
  }

  const act = t.closest("[data-act]");
  if (act) { handleAct(act.dataset.act, act); return; }
});

/* ============================================================
   AUTO-ADVANCE

   350 questions on a phone means 350 manual scrolls, so scoring one brings the
   next into view. Two things it must not do:

   • Move when you are CHANGING a score. It advances only on a question that had
     no score, so correcting one never pulls the page out from under you.
   • Let the next tap land on the wrong question. The scroll takes a moment, and
     a finger already on its way down would hit whatever slid into that spot, so
     score taps are ignored until the movement is done. 380ms — below the point
     where a deliberate tap feels swallowed, above the length of the animation.
   ============================================================ */
const REDUCED_MOTION = (() => {
  try { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; }
})();
let advanceUntil = 0;
const advancing = () => Date.now() < advanceUntil;

function scrollCardIntoPlace(el) {
  const head = document.querySelector("header");
  const pad = (head ? head.getBoundingClientRect().height : 0) + 10;
  const top = Math.max(0, window.scrollY + el.getBoundingClientRect().top - pad);
  advanceUntil = Date.now() + 380;
  window.scrollTo({ top: top, behavior: REDUCED_MOTION ? "auto" : "smooth" });
}

/* The next question on screen. Cards in collapsed subjects are in the DOM but
   hidden, so the walk opens the next subject rather than scrolling to something
   invisible — otherwise every subject ends in a dead stop. */
function nextCardAfter(card) {
  const body = card.closest(".subjbody");
  if (!body) return null;
  const here = [...body.querySelectorAll(".qcard")];
  const k = here.indexOf(card);
  if (k > -1 && here[k + 1]) return here[k + 1];

  let group = card.closest(".subjgroup");
  while (group && (group = group.nextElementSibling)) {
    if (!group.classList || !group.classList.contains("subjgroup")) continue;
    const b = group.querySelector(".subjbody"), first = b && b.querySelector(".qcard");
    if (!first) continue;
    if (b.hidden) {
      const head = group.querySelector(".subjhead");
      b.hidden = false;
      head.setAttribute("aria-expanded", "true");
      ui.open[head.dataset.subj] = true;
    }
    return first;
  }
  return null;
}

function advanceFrom(card) {
  if (!state.autoAdvance) return;
  const next = nextCardAfter(card);
  if (next) { scrollCardIntoPlace(next); return; }
  const aid = ui.area;
  if (aid && !unansweredIdx(aid).length) toast("All " + AREA_BY_ID[aid].questions.length + " scored in this area");
}

function refreshCard(card, aid, i) {
  const a = AREA_BY_ID[aid], q = Object.assign({}, a.questions[i], { __i: i });
  const tmp = document.createElement("div");
  tmp.innerHTML = qCardHTML(a, q);
  card.replaceWith(tmp.firstElementChild);
}

function handleAct(act, el) {
  const card = el.closest(".qcard");
  if (card) {
    const [aid, iS] = card.dataset.q.split("|"), i = +iS;
    if (act === "comment") { const w = card.querySelector(".cmtwrap"); w.hidden = !w.hidden; if (!w.hidden) card.querySelector("textarea").focus(); return; }
    if (act === "cancelcmt") { card.querySelector(".cmtwrap").hidden = true; return; }
    if (LOCKED() && (act === "savecmt" || act === "clear" || act === "comment")) {
      toast(LIC.unlicensed ? "A licence key is needed first" : "Licence ended \u2014 this assessment is read-only"); return;
    }
    if (act === "savecmt") {
      const txt = card.querySelector("textarea").value.trim();
      setResp(aid, i, state.lane === "self" ? { sac: txt } : { eac: txt });
      refreshCard(card, aid, i); toast("Note saved"); return;
    }
    if (act === "clear") {
      setScore(aid, i, state.lane, null);
      refreshCard(card, aid, i); return;
    }
  }
  if (act === "install") {
    if (!installPrompt) { toast("Use your browser's install button"); return; }
    installPrompt.prompt();
    installPrompt.userChoice.then(r => {
      installPrompt = null;
      toast(r && r.outcome === "accepted" ? "Installing\u2026" : "Not installed");
      render(true);
    });
    return;
  }
  if (act === "toggletable") { ui.showTable = !ui.showTable; render(true); return; }
  if (act === "csv") { download(buildCSV(), reportName("csv"), "text/csv;charset=utf-8"); return; }
  if (act === "json") {
    download(JSON.stringify({ app: "cvm-assess", version: 2, build: BUILD, edition: FIXED_LANE || "full",
      exported: new Date().toISOString(), state: exportState() }, null, 2),
      submissionName(), "application/json");
    return;
  }
  if (act === "tolicence") { ui.tab = "more"; render(); toast("Paste the key here"); return; }
  if (act === "licapply") {
    const box = $("#fLicence");
    const key = (box ? box.value : "").trim();
    verifyKey(key).then(claim => {
      if (!claim) { toast("That key is not valid"); return; }
      state.licence = key; save();
      refreshLicence().then(() => {
        render();
        toast(LIC.expired ? "That key ended on " + niceDate(LIC.expires)
          : "Licensed to " + (LIC.client || "you") + " until " + niceDate(LIC.expires));
      });
    });
    return;
  }
  if (act === "licclear") {
    state.licence = ""; save();
    refreshLicence().then(() => { render(); toast("Key removed"); });
    return;
  }
  if (LOCKED() && (act === "import" || act === "merge" || act === "reseed" || act === "blank")) {
    toast(LIC.unlicensed ? "A licence key is needed first" : "Licence ended \u2014 nothing new can be loaded"); return;
  }
  if (act === "import") { $("#fileIn").click(); return; }
  if (act === "merge") { if (CONSOLIDATOR) $("#mergeIn").click(); return; }
  if (act === "undomerge") {
    if (!undoSnapshot) { toast("Nothing to undo"); return; }
    if (!confirm("Undo the last import? Everything merged in that step is removed.")) return;
    try { state = JSON.parse(undoSnapshot); } catch (e) { toast("Undo failed"); return; }
    undoSnapshot = null; save(); render(); toast("Last import undone"); return;
  }
  if (act === "report") { makeReport(); return; }
  if (act === "blank") {
    if (!confirm("Clear all scores and notes and start a blank assessment?")) return;
    state.responses = {}; state.seeded = false; save(); toast("Blank assessment started"); render(); return;
  }
  if (act === "reseed") {
    if (!confirm("Load the sample data from the workbook (" + (DATA.client || "the workbook client") + ")? This replaces current answers.")) return;
    state.responses = workbookData();
    if (!state.client) state.client = DATA.client || "";
    state.seeded = true; save(); render(); toast("Sample data loaded"); return;
  }
}

document.querySelector("main").addEventListener("input", e => {
  if (e.target.id === "qsearch") {
    clearTimeout(window.__st);
    const v = e.target.value;
    window.__st = setTimeout(() => { ui.query = v; render(true); const s = $("#qsearch"); if (s) { s.focus(); s.setSelectionRange(v.length, v.length); } }, 260);
  }
});
/* Which of the "fill this in before exporting" prompts apply. Re-rendering only
   when this flips keeps focus from being yanked as you tab between fields. */
const warnSig = () => [!!state.assessor, !!state.client, !!state.title].join("");

document.querySelector("main").addEventListener("change", e => {
  const before = warnSig();
  if (e.target.id === "fClient") { state.client = e.target.value.trim(); save(); chrome(); }
  if (e.target.id === "fTitle") { state.title = e.target.value.trim(); save(); chrome(); }
  if (e.target.id === "fAppendix") { ui.reportAppendix = e.target.checked; }
  if (e.target.id === "fAuto") {
    state.autoAdvance = e.target.checked; save();
    toast(state.autoAdvance ? "Will move to the next question" : "Will stay where you are");
  }
  if (e.target.id === "fAssessor") { state.assessor = e.target.value.trim(); save(); }
  if (e.target.id === "fLane") {
    state.type = e.target.value;
    if (state.type !== "comparison" && state.type !== "consolidate") state.lane = state.type;
    ui.area = null; ui.pick = null;
    save(); render();
    toast(state.type === "comparison" ? "Comparison mode"
      : state.type === "consolidate" ? "Consolidating self and external"
      : "Now completing: " + laneName(state.lane));
  }
  if (warnSig() !== before && ui.tab === "more") render(true);
});
document.querySelector("main").addEventListener("blur", e => {
  if (e.target.matches("textarea[data-cmt]")) {
    const card = e.target.closest(".qcard"); if (!card) return;
    const [aid, iS] = card.dataset.q.split("|"), i = +iS, txt = e.target.value.trim();
    if (txt !== cmt(aid, i, state.lane)) setResp(aid, i, state.lane === "self" ? { sac: txt } : { eac: txt });
  }
}, true);

/* ---------- comparison slots ----------
   Each slot takes a finished assessment and loads its consolidated scores into one
   of the two series. Everything downstream — charts, gaps, tables, report — is the
   existing comparison machinery, relabelled. */
function loadComparison(slot, file) {
  const reader = new FileReader();
  reader.onload = () => {
    let sub;
    try {
      const parsed = JSON.parse(reader.result);
      sub = parsed && parsed.state ? parsed.state : parsed;
      if (!sub || typeof sub.responses !== "object") throw new Error("not a CVM assessment export");
    } catch (err) {
      alert("That file could not be read as an assessment export.\n\n" + (err.message || ""));
      return;
    }
    /* A locked edition compares two of its own kind. A file whose answers are all
       in the other one is not a thing this copy can put on its charts — and
       loading it anyway would label an external assessment with a self assessment's
       title, which is worse than refusing. */
    if (SOLO) {
      let mine = 0, theirs = 0;
      Object.keys(sub.responses || {}).forEach(k => {
        const r = sub.responses[k]; if (!r) return;
        const a = r.sa != null, b = r.ea != null;
        if (FIXED_LANE === "self") { if (a) mine++; if (b) theirs++; }
        else { if (b) mine++; if (a) theirs++; }
      });
      if (!mine && theirs) {
        alert("That file is a " + laneName(FIXED_LANE === "self" ? "external" : "self").toLowerCase() +
              ".\n\nThis app compares " + laneName(FIXED_LANE).toLowerCase() + "s with each other.");
        return;
      }
    }
    const target = slot === "A" ? "sa" : "ea";
    const noteKey = slot === "A" ? "sac" : "eac";
    let n = 0;
    // wipe this slot first, so replacing a file cannot leave stale scores behind
    Object.keys(state.responses).forEach(k => {
      const r = state.responses[k];
      if (!r) return;
      r[target] = null; r[noteKey] = "";
    });
    Object.keys(sub.responses).forEach(k => {
      const their = sub.responses[k];
      if (!their) return;
      const parts = k.split("|");
      if (!AREA_BY_ID[parts[0]] || !AREA_BY_ID[parts[0]].questions[Number(parts[1])]) return;
      const v = their.sa != null ? their.sa : their.ea;     // whichever lane they used
      const note = their.sac || their.eac || "";
      if (v == null && !note) return;
      if (!state.responses[k]) state.responses[k] = { sa: null, ea: null, sac: "", eac: "" };
      state.responses[k][target] = v == null ? null : v;
      state.responses[k][noteKey] = note;
      if (v != null) n++;
    });
    const meta = { title: sub.title || "", client: sub.client || "", assessor: sub.assessor || "", n: n };
    if (slot === "A") state.cmpA = meta; else state.cmpB = meta;
    if (!state.client && sub.client) state.client = sub.client;
    save(); render();
    toast("Loaded " + n + " scores as " + (meta.title || "Assessment " + slot));
  };
  reader.onerror = () => alert("That file could not be read.");
  reader.readAsText(file);
}

let cmpSlot = null;
$("#cmpIn").addEventListener("change", e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = "";
  if (f && cmpSlot) loadComparison(cmpSlot, f);
});

/*__MERGEUI_START__*/
$("#mergeIn").addEventListener("change", e => {
  const files = [...(e.target.files || [])];
  e.target.value = "";
  if (!files.length) return;
  readFiles(files, items => {
    pendingImport = items;
    showImportSheet();
  });
});

/* Import review sheet */
$("#sheetHost").addEventListener("click", e => {
  const pick = e.target.closest("[data-lanechoice]");
  if (pick) {
    const [i, lane] = pick.dataset.lanechoice.split("|");
    pendingImport[+i].lane = lane;
    haptic("light");
    showImportSheet();
    return;
  }
  const act = e.target.closest("[data-import]");
  if (!act) return;
  if (act.dataset.import === "cancel") { hideImportSheet(); toast("Import cancelled"); return; }
  if (act.dataset.import === "go") { runPendingImport(); return; }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("#sheetHost").hidden) { hideImportSheet(); }
});
/*__MERGEUI_END__*/

$("#fileIn").addEventListener("change", e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const o = JSON.parse(r.result), s = o && o.state ? o.state : o;
      if (!s || typeof s.responses !== "object") throw 0;
      state = Object.assign(state, s); save(); applyTheme(); render();
      toast("Backup restored");
    } catch (err) { alert("That file could not be read as a CVM assessment backup."); }
    e.target.value = "";
  };
  r.readAsText(f);
});

/* FAB: jump between unanswered */
function unansweredIdx(aid) {
  return AREA_BY_ID[aid].questions.map((q, i) => i).filter(i => val(aid, i, state.lane) == null);
}
$("#fabNext").addEventListener("click", () => {
  if (!ui.area) return;
  const list = unansweredIdx(ui.area);
  if (!list.length) { toast("All " + AREA_BY_ID[ui.area].questions.length + " questions scored"); return; }
  const y = window.scrollY;
  let target = list[0];
  for (const i of list) {
    const el = document.getElementById("q-" + ui.area + "-" + i);
    if (el && el.getBoundingClientRect().top > 90) { target = i; break; }
  }
  gotoQuestion(ui.area, target);
  window.scrollTo(0, y);
  requestAnimationFrame(() => {
    const el = document.getElementById("q-" + ui.area + "-" + target);
    if (el) el.scrollIntoView({ block: "center", behavior: "smooth" });
  });
});
/* SVG marks are focusable buttons — Enter/Space must act like a tap. */
document.querySelector("main").addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const cat = e.target.closest && e.target.closest("[data-cat]");
  if (!cat) return;
  e.preventDefault();
  ui.pick = ui.pick === cat.dataset.cat ? null : cat.dataset.cat;
  render(true);
});

/* Charts are sized to the measured container, so redraw them when that changes
   (rotation, Split View, Stage Manager, desktop window resize). */
let resizeTimer = null;
function onResize() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (ui.tab === "dash") render(true); }, 180);
}
window.addEventListener("resize", onResize);
window.addEventListener("orientationchange", onResize);

applyTheme();
render();

/* Verification is asynchronous, so the first paint happens unlicensed and the
   licence settles a moment later. Rendering twice is cheaper than holding the
   whole app behind a signature check. */
if (LICENSED) refreshLicence().then(() => { save(); render(true); });

/* ---------- offline install ----------
   Registers the service worker that precaches the app so it launches
   with no network once added to the home screen. */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => { /* file:// or unsupported */ });
  });
}
</script>
</body>
</html>
