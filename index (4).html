<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CVM Consol">
<meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
<title>CVM Consolidator</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  color-scheme: light;
  --surface-0:#f4f3f0; --surface-1:#fcfcfb; --surface-2:#ffffff;
  --border:#e2e0da; --border-strong:#cdcac1;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#7b7a74;
  --series-1:#2a78d6; --series-2:#eb6834;
  --series-1-soft:#e5eefb; --series-2-soft:#fdece4;
  --seq-100:#cde2fb; --seq-250:#86b6ef; --seq-400:#3987e5; --seq-550:#1c5cab; --seq-700:#0d366b;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --neutral-mid:#f0efec;
  --grid:#eae8e2;
  --accent:#2a78d6;
  --shadow:0 1px 2px rgba(11,11,11,.06),0 1px 8px rgba(11,11,11,.04);
  --radius:14px;
  --tap:44px;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --surface-0:#111110; --surface-1:#1a1a19; --surface-2:#232322;
    --border:#333330; --border-strong:#464642;
    --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#98978d;
    --series-1:#3987e5; --series-2:#d95926;
    --series-1-soft:#17263a; --series-2-soft:#33200f;
    --seq-100:#0d366b; --seq-250:#184f95; --seq-400:#256abf; --seq-550:#3987e5; --seq-700:#86b6ef;
    --neutral-mid:#383835;
    --grid:#2b2b29;
    --accent:#3987e5;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 1px 8px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface-0:#111110; --surface-1:#1a1a19; --surface-2:#232322;
  --border:#333330; --border-strong:#464642;
  --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#98978d;
  --series-1:#3987e5; --series-2:#d95926;
  --series-1-soft:#17263a; --series-2-soft:#33200f;
  --seq-100:#0d366b; --seq-250:#184f95; --seq-400:#256abf; --seq-550:#3987e5; --seq-700:#86b6ef;
  --neutral-mid:#383835;
  --grid:#2b2b29;
  --accent:#3987e5;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 1px 8px rgba(0,0,0,.25);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--surface-0); color:var(--text-primary);
  font:400 16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;font-size:16px;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
a{color:var(--accent)}

/* ---------- app shell ---------- */
#app{display:flex;flex-direction:column;min-height:100%}
.topbar{
  position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--surface-1) 88%,transparent);
  backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);
  border-bottom:1px solid var(--border);
  padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;
}
.topbar-row{display:flex;align-items:center;gap:10px;min-height:34px}
.topbar h1{font-size:19px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .sub{font-size:12.5px;color:var(--text-muted);margin-top:1px}
.iconbtn{
  min-width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;
  color:var(--accent);font-size:14.5px;font-weight:600;padding:0 8px;flex:none
}
.iconbtn:active{background:var(--surface-2)}
main{flex:1;padding:14px 16px calc(96px + env(safe-area-inset-bottom))}
body.has-fab main{padding-bottom:calc(146px + env(safe-area-inset-bottom))}
.view[hidden]{display:none}

/* ---------- tab bar ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;
  background:color-mix(in srgb,var(--surface-1) 92%,transparent);
  backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);
  border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar button{
  flex:1;padding:8px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;font-weight:550;color:var(--text-muted);letter-spacing:.01em;min-height:var(--tap)
}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---------- cards ---------- */
.card{
  background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:14px;margin-bottom:12px
}
.card.tight{padding:12px}
.card-title{font-size:13px;font-weight:650;letter-spacing:.02em;text-transform:uppercase;color:var(--text-secondary);margin-bottom:2px}
.card-note{font-size:12.5px;color:var(--text-muted);margin-bottom:12px;line-height:1.4}
.section-label{font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);margin:20px 2px 8px}
.section-label:first-child{margin-top:2px}

/* ---------- area list ---------- */
.arealist{display:flex;flex-direction:column;gap:10px}
.arearow{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:13px 14px;min-height:var(--tap)
}
.arearow:active{background:var(--surface-2)}
.arearow .meta{flex:1;min-width:0}
.arearow .nm{font-size:15.5px;font-weight:600;line-height:1.25}
.arearow .dt{font-size:12.5px;color:var(--text-muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chev{color:var(--text-muted);flex:none;font-size:19px;line-height:1}
.ring{flex:none;width:46px;height:46px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .pct{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:11.5px;font-weight:650;font-variant-numeric:tabular-nums
}

/* ---------- lane switch (self / external) ---------- */
.lanes{display:flex;gap:6px;background:var(--surface-0);border:1px solid var(--border);border-radius:11px;padding:3px;margin-bottom:12px}
.lanes button{
  flex:1;min-height:38px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--text-secondary);
  display:flex;align-items:center;justify-content:center;gap:7px
}
.lanes button[aria-pressed="true"]{background:var(--surface-2);color:var(--text-primary);box-shadow:var(--shadow)}
/* The moderating switch inside the lane bar: same control, sized to sit in a row. */
.lanes.laneseg{flex:none;margin:0;gap:4px}
.lanes.laneseg button{padding:0 11px;min-height:34px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.lanes.laneseg .swatch{width:9px;height:9px;flex:none}
.swatch{width:9px;height:9px;border-radius:2px;flex:none}
.sw1{background:var(--series-1)} .sw2{background:var(--series-2)}

/* ---------- question card ---------- */
.qcard{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:10px}
.qhead{display:flex;gap:8px;align-items:baseline;margin-bottom:7px}
.qnum{font-size:11.5px;font-weight:650;color:var(--text-muted);font-variant-numeric:tabular-nums;flex:none}
.qtext{font-size:15px;line-height:1.4;font-weight:450}
.subjtag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--text-secondary);background:var(--surface-0);border:1px solid var(--border);border-radius:999px;padding:2px 9px;margin-bottom:8px}
.scale{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:11px}
.scale button{
  min-height:42px;border:1px solid var(--border-strong);border-radius:9px;background:var(--surface-2);
  font-size:14.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--text-secondary);
  display:flex;align-items:center;justify-content:center
}
.scale button:active{transform:scale(.94)}
.scale button[aria-pressed="true"]{color:#fff;border-color:transparent}
.lane-self .scale button[aria-pressed="true"]{background:var(--series-1)}
.lane-external .scale button[aria-pressed="true"]{background:var(--series-2)}
.scalefoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:9px;font-size:12.5px}
.levelname{font-weight:600;color:var(--text-primary)}
.levelname.empty{color:var(--text-muted);font-weight:450}
.otherlane{color:var(--text-secondary);display:flex;align-items:center;gap:6px;font-size:12px;flex:none}
.qactions{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.minibtn{
  border:1px solid var(--border-strong);border-radius:9px;padding:0 12px;min-height:36px;
  font-size:13px;font-weight:600;color:var(--text-secondary);display:inline-flex;align-items:center;gap:6px
}
.minibtn:active{background:var(--surface-0)}
.minibtn.on{color:var(--accent);border-color:var(--accent)}
.cmtwrap{margin-top:10px}
.cmtwrap[hidden]{display:none}
.cmtwrap label{display:block;font-size:11.5px;font-weight:650;letter-spacing:.03em;text-transform:uppercase;color:var(--text-muted);margin-bottom:5px}
textarea{
  width:100%;min-height:76px;padding:10px 11px;border:1px solid var(--border-strong);border-radius:10px;
  background:var(--surface-2);resize:vertical;line-height:1.4
}
textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.savedcmt{font-size:13px;color:var(--text-secondary);background:var(--surface-0);border-left:3px solid var(--border-strong);padding:8px 10px;border-radius:0 8px 8px 0;margin-top:9px;white-space:pre-wrap}
.savedcmt b{display:block;font-size:11px;letter-spacing:.03em;text-transform:uppercase;color:var(--text-muted);margin-bottom:3px;font-weight:650}

/* ---------- filter row ---------- */
.filters{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.chip{
  flex:none;border:1px solid var(--border-strong);border-radius:999px;padding:0 13px;min-height:34px;
  font-size:13px;font-weight:600;color:var(--text-secondary);display:inline-flex;align-items:center;gap:6px;
  background:var(--surface-1)
}
.chip[aria-pressed="true"]{background:var(--text-primary);color:var(--surface-1);border-color:var(--text-primary)}
.searchwrap{position:relative;margin-bottom:12px}
.searchwrap input{
  width:100%;min-height:40px;padding:0 36px 0 12px;border:1px solid var(--border-strong);
  border-radius:11px;background:var(--surface-1)
}
.searchwrap .clr{position:absolute;right:4px;top:3px;width:34px;height:34px;color:var(--text-muted);font-size:17px}

/* ---------- subject group ---------- */
.subjgroup{margin-bottom:8px}
.subjhead{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 13px;min-height:var(--tap);
  background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)
}
.subjhead .nm{flex:1;font-size:14.5px;font-weight:600;line-height:1.3}
.subjhead .cnt{font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums;flex:none}
.subjhead .caret{color:var(--text-muted);flex:none;transition:transform .18s;font-size:12px}
.subjhead[aria-expanded="true"]{border-radius:var(--radius) var(--radius) 0 0}
.subjhead[aria-expanded="true"] .caret{transform:rotate(90deg)}
.subjbody{padding:10px 0 2px}
.subjbody[hidden]{display:none}
.dualpair{display:flex;gap:3px;align-items:center;flex:none}
.dualpair span{
  min-width:23px;height:23px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;
  font-size:11.5px;font-weight:650;font-variant-numeric:tabular-nums;color:#fff
}
.dualpair .d1{background:var(--series-1)} .dualpair .d2{background:var(--series-2)}
.dualpair .dn{background:var(--surface-0);color:var(--text-muted);border:1px dashed var(--border-strong)}
/* ---------- dashboard ---------- */
/* Names the assessment on screen. Without it the only thing identifying the data
   was the series labels, which is thin with one series and ambiguous with two. */
.dashhead{margin:2px 0 14px}
.dashhead .dh-kicker{font-size:11px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted)}
.dashhead .dh-title{font-size:20px;font-weight:680;letter-spacing:-.015em;line-height:1.25;margin-top:3px;overflow-wrap:anywhere}
.dashhead .dh-sub{font-size:12.5px;color:var(--text-secondary);margin-top:3px;line-height:1.35}
.dashhead .dh-pair{margin-top:5px}
.dashhead .dh-pair>span{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:650;line-height:1.3;overflow-wrap:anywhere}
.dashhead .dh-pair>span .swatch{flex:none}
.dashhead .dh-pair em{font-style:normal;font-weight:550;color:var(--text-muted)}
.dashhead .dh-pair .vs{display:block;font-size:10.5px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;
  color:var(--text-muted);margin:3px 0 3px 20px}
.hero{display:flex;gap:10px;margin-bottom:12px}
.tile{
  flex:1;background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:13px 14px;min-width:0
}
.tile .lbl{font-size:11.5px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);display:flex;align-items:center;gap:6px}
.tile .val{font-size:30px;font-weight:680;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:5px}
.tile .val small{font-size:14px;font-weight:550;color:var(--text-muted);letter-spacing:0}
.tile .cap{font-size:12px;color:var(--text-secondary);margin-top:2px;line-height:1.3}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px;font-size:12.5px;color:var(--text-secondary)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:block}

.bars{display:flex;flex-direction:column;gap:13px}
.barrow{width:100%;text-align:left;display:block;background:none;padding:0}
.barrow .cat{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:5px}
.barrow .cat .nm{font-size:13.5px;font-weight:600;line-height:1.25;min-width:0}
.barrow .cat .gp{font-size:11.5px;font-weight:650;font-variant-numeric:tabular-nums;flex:none;letter-spacing:.01em}
.track{position:relative;height:11px;background:var(--grid);border-radius:4px;margin-bottom:2px}
.track:last-of-type{margin-bottom:0}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;min-width:3px;transition:width .35s cubic-bezier(.3,.9,.3,1)}
.fill.f1{background:var(--series-1)} .fill.f2{background:var(--series-2)}
.barvals{display:flex;gap:10px;margin-top:5px;font-size:11.5px;color:var(--text-secondary);font-variant-numeric:tabular-nums}
.barvals b{color:var(--text-primary);font-weight:650}
.axis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-muted);font-variant-numeric:tabular-nums;margin-top:9px;padding-top:7px;border-top:1px solid var(--grid)}

.gaplist{display:flex;flex-direction:column;gap:2px}
.gapitem{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--grid)}
.gapitem:last-child{border-bottom:0}
.gapitem .txt{flex:1;min-width:0}
.gapitem .q{font-size:13.5px;line-height:1.35}
.gapitem .a{font-size:11.5px;color:var(--text-muted);margin-top:3px}
.gapchip{
  flex:none;display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:8px;
  font-size:12px;font-weight:650;font-variant-numeric:tabular-nums;border:1px solid transparent
}
.gapchip.over{color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent);border-color:color-mix(in srgb,var(--good) 34%,transparent)}
.gapchip.under{color:var(--critical);background:color-mix(in srgb,var(--critical) 12%,transparent);border-color:color-mix(in srgb,var(--critical) 34%,transparent)}
.gapchip.flat{color:var(--text-secondary);background:var(--surface-0);border-color:var(--border-strong)}

table.dt{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
table.dt th,table.dt td{text-align:right;padding:7px 4px;border-bottom:1px solid var(--grid);white-space:nowrap}
table.dt th:first-child,table.dt td:first-child{text-align:left;white-space:normal;min-width:34%}
table.dt th{font-size:11px;letter-spacing:.03em;text-transform:uppercase;color:var(--text-muted);font-weight:650}
table.dt td b{font-weight:650}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

.meter{height:9px;border-radius:4px;background:var(--grid);overflow:hidden;margin-top:9px}
.meter i{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--seq-400)}

/* ---------- slicer ---------- */
.slicer{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 13px 13px;margin-bottom:12px}
.slicer-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.slicer-head span{font-size:11.5px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted)}
.slicer-all{font-variant-numeric:tabular-nums}
.slicer .filters{margin-bottom:0}
.linkbtn{font-size:12.5px;font-weight:650;color:var(--accent);padding:2px 0;min-height:24px}

/* ---------- charts ---------- */
.chart-wide{display:block}
.chart-host{margin:2px 0 4px;display:flex;flex-direction:column;align-items:center}
svg.radar,svg.barchart{display:block;max-width:100%;overflow:visible;touch-action:manipulation}
svg.barchart{align-self:stretch}
.wedge{cursor:pointer}
[data-cat]{cursor:pointer}
[data-cat]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.radarkey{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;width:100%}
.radarkey li{display:flex;gap:7px;align-items:baseline;font-size:11.5px;color:var(--text-secondary);line-height:1.3;padding:2px 0;cursor:pointer}
.radarkey li b{flex:none;min-width:14px;font-variant-numeric:tabular-nums;color:var(--text-muted);font-weight:650}
.radarkey li.on{color:var(--text-primary);font-weight:600}
.radarkey li.on b{color:var(--accent)}
.readout{border-top:1px solid var(--grid);margin-top:10px;padding-top:11px}
.readout.muted{font-size:12.5px;color:var(--text-muted);text-align:center;padding-top:10px}
.ro-name{font-size:14px;font-weight:650;line-height:1.3;display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.ro-area{font-size:11.5px;font-weight:500;color:var(--text-muted)}
.ro-vals{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:7px;font-size:12.5px;color:var(--text-secondary)}
.ro-vals span{display:inline-flex;align-items:center;gap:6px}
.ro-vals b{font-size:15px;font-weight:680;color:var(--text-primary);font-variant-numeric:tabular-nums}
.ro-n{color:var(--text-muted);font-variant-numeric:tabular-nums}

.srcline{font-size:11.5px;color:var(--text-muted);margin-top:7px;line-height:1.4;padding-left:9px;border-left:2px solid var(--border-strong)}
.srcline.avg{color:var(--text-secondary);border-left-color:var(--warning)}
.srcline.other{opacity:.8}
.warnbox{font-size:12.5px;line-height:1.45;color:var(--text-secondary);background:color-mix(in srgb,var(--warning) 13%,transparent);
  border:1px solid color-mix(in srgb,var(--warning) 40%,transparent);border-radius:10px;padding:9px 11px;margin-top:2px}
.checkrow{display:flex;gap:11px;align-items:flex-start;padding:10px 2px 2px;cursor:pointer}
.checkrow input{width:22px;height:22px;flex:none;margin:1px 0 0;accent-color:var(--accent)}
.checkrow span{font-size:14px;font-weight:600;line-height:1.35}
.checkrow small{display:block;font-size:12px;font-weight:400;color:var(--text-muted);margin-top:2px}

/* ---------- licence ---------- */
#licbar{margin:0 0 12px}
#licbar[hidden]{display:none}
.licnote{border-radius:var(--radius);padding:11px 13px;font-size:13px;line-height:1.45;
  border:1px solid var(--border-strong);background:var(--surface-1)}
.licnote strong{display:block;font-size:14px;font-weight:680;margin-bottom:2px}
.licnote.warn{border-color:#c8892b;background:color-mix(in srgb,#e8a33c 12%,var(--surface-1))}
.licnote.stop{border-color:#c0392b;background:color-mix(in srgb,#e05a45 13%,var(--surface-1))}
.licrow{display:flex;gap:8px;align-items:center;margin-top:9px;flex-wrap:wrap}
.licstate{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--border-strong);
  border-radius:var(--radius);padding:11px 12px;background:var(--surface-0);margin-bottom:11px}
.licstate .dot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:4px;background:var(--text-muted)}
.licstate.ok .dot{background:#2e9c5a} .licstate.warn .dot{background:#d8912f} .licstate.stop .dot{background:#c0392b}
.licstate strong{display:block;font-size:14px;font-weight:650}
.licstate span{display:block;font-size:12px;color:var(--text-muted);line-height:1.4;margin-top:2px;overflow-wrap:anywhere}
.lickey{width:100%;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;
  padding:10px 11px;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface-1);
  color:var(--text-primary);min-height:74px;resize:vertical}

/* The one-line reassurance under a Setup field. */
.fieldnote{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--text-muted);
  line-height:1.45;margin-top:7px}
.fieldnote .swatch{width:10px;height:10px;flex:none;margin-top:4px}

/* ---------- active assessment type ---------- */
/* The two assessments a consolidation holds, side by side. */
.lanestack{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.lanecard{background:var(--surface-0);border:1px solid var(--border);border-radius:var(--radius);padding:11px 12px}
.lanecard.lane-self{border-left:3px solid var(--series-1)}
.lanecard.lane-external{border-left:3px solid var(--series-2)}
.lanecard-head{display:flex;align-items:center;gap:8px;font-size:13.5px}
.lanecard-head strong{flex:1;min-width:0}
.lanecard-head span{font-size:12.5px;color:var(--text-secondary);font-variant-numeric:tabular-nums;flex:none}
.lanecard .meter{margin:8px 0 6px}
.lanecard-who{font-size:11.5px;color:var(--text-muted);line-height:1.35;overflow-wrap:anywhere}
.lanebar{display:flex;align-items:center;gap:9px;background:var(--surface-1);border:1px solid var(--border);
  border-radius:11px;box-shadow:var(--shadow);padding:10px 13px;margin-bottom:12px;font-size:13.5px}
.lanebar .swatch{width:11px;height:11px;flex:none}
.lanebar span{font-weight:650;flex:1;min-width:0}
.lanebar span:first-child{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted)}
.lanebar em{font-style:normal;font-size:11.5px;color:var(--text-muted);flex:none}
.lanebar.lane-self{border-left:3px solid var(--series-1)}
.lanebar.lane-external{border-left:3px solid var(--series-2)}
.lanebar .linkbtn{min-height:34px;display:inline-flex;align-items:center;padding:0 2px;flex:none}

.lanebar.lane-cmp{border-left:3px solid var(--series-1)}
.cmprow{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-top:11px;font-size:12.5px;color:var(--text-secondary)}
.cmprow span{display:inline-flex;align-items:center;gap:6px}
.cmprow b{font-size:16px;font-weight:680;color:var(--text-primary);font-variant-numeric:tabular-nums;margin-left:2px}
.cmpslot{border:1px solid var(--border-strong);border-radius:11px;padding:11px 12px;margin-top:10px;background:var(--surface-2)}
.cmpslot.filled{border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.cmpslot-head{display:flex;gap:11px;align-items:flex-start}
.cmpslot-head .swatch{width:11px;height:11px;margin-top:4px;flex:none}
.cmpslot strong{display:block;font-size:14.5px;font-weight:650;line-height:1.3}
.cmpslot span{display:block;font-size:12px;color:var(--text-muted);margin-top:2px}
.cmpslot .qactions{margin-top:9px}
.hintbox{font-size:12.5px;line-height:1.45;color:var(--text-secondary);background:var(--surface-0);
  border:1px solid var(--border);border-radius:10px;padding:9px 11px;margin-top:-4px}

/* ---------- branding ---------- */
/* The wordmark is navy on white, so it always sits on a white plate — on the dark
   theme a transparent logo would simply disappear. */
.logoplate{background:#fff;border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:14px 18px;margin-bottom:12px;display:flex;justify-content:center}
.logoplate img{display:block;width:100%;max-width:210px;height:auto}
@media (min-width:768px){ .logoplate img{max-width:260px} }

/* ---------- import review sheet ---------- */
body.sheet-open{overflow:hidden}
.sheet-backdrop{position:fixed;inset:0;background:rgba(11,11,11,.45);z-index:300;
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:310;background:var(--surface-1);
  border-radius:18px 18px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.3);
  display:flex;flex-direction:column;max-height:92vh;
  padding-bottom:env(safe-area-inset-bottom)}
.sheet-head{padding:18px 18px 12px;border-bottom:1px solid var(--border)}
.sheet-head h2{font-size:18px}
.sheet-head p{margin:5px 0 0;font-size:12.5px;color:var(--text-muted);line-height:1.4}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 18px;flex:1}
.sheet-foot{padding:12px 18px 16px;border-top:1px solid var(--border);background:var(--surface-1);
  border-radius:0 0 18px 18px}
.tally{font-size:12.5px;color:var(--text-secondary);margin-bottom:10px;text-align:center}
.tally b{color:var(--text-primary);font-variant-numeric:tabular-nums}
.sheet-actions{display:flex;gap:9px}
.sheet-actions .bigbtn{flex:1}
.bigbtn[disabled]{opacity:.45}
.subcard{border:1px solid var(--border);border-radius:12px;padding:12px 13px;margin-bottom:10px;background:var(--surface-2)}
.subcard.flagged{border-color:color-mix(in srgb,var(--warning) 55%,transparent)}
.subcard-top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.subcard .who{font-size:15px;font-weight:650;line-height:1.25}
.subcard .meta{font-size:12px;color:var(--text-muted);margin-top:2px;line-height:1.35}
.subcard .meta.file{font-size:11px;opacity:.8}
.subcard .counts{flex:none;font-size:11.5px;font-weight:650;color:var(--text-secondary);
  background:var(--surface-0);border:1px solid var(--border);border-radius:999px;padding:3px 9px;white-space:nowrap}
.flag{font-size:12px;line-height:1.4;color:var(--text-secondary);margin-top:9px;
  background:color-mix(in srgb,var(--warning) 13%,transparent);
  border:1px solid color-mix(in srgb,var(--warning) 38%,transparent);border-radius:9px;padding:8px 10px}
.lanepick{display:flex;gap:6px;background:var(--surface-0);border:1px solid var(--border);
  border-radius:11px;padding:3px;margin-top:11px}
.lanepick button{flex:1;min-height:42px;border-radius:8px;font-size:13px;font-weight:600;
  color:var(--text-secondary);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.lanepick button small{font-size:10.5px;font-weight:500;color:var(--text-muted)}
.lanepick button[aria-pressed="true"]{background:var(--surface-2);color:var(--text-primary);box-shadow:var(--shadow)}
.lanepick button[aria-pressed="true"] small{color:var(--text-secondary)}
.moved{font-size:12px;color:var(--text-secondary);margin-top:9px;line-height:1.4;
  padding-left:9px;border-left:2px solid var(--accent)}
@media (min-width:768px){
  .sheet{left:50%;right:auto;transform:translateX(-50%);width:560px;bottom:0;border-radius:18px 18px 0 0}
}

/* ---------- scale reference / settings ---------- */
.scalelist{display:flex;flex-direction:column;gap:1px}
.scaleitem{display:flex;gap:11px;align-items:center;padding:9px 0;border-bottom:1px solid var(--grid)}
.scaleitem:last-child{border-bottom:0}
.scaleitem .n{
  width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;
  font-size:13px;font-weight:650;color:var(--text-primary);font-variant-numeric:tabular-nums;
  border:1px solid color-mix(in srgb,var(--accent) 45%,transparent)
}
.scaleitem .d{flex:1;min-width:0}
.scaleitem .d strong{display:block;font-size:14px;font-weight:600}
.scaleitem .d span{font-size:12.5px;color:var(--text-muted);line-height:1.35;display:block;margin-top:1px}
.field{margin-bottom:13px}
.field label{display:block;font-size:11.5px;font-weight:650;letter-spacing:.03em;text-transform:uppercase;color:var(--text-muted);margin-bottom:5px}
.field input,.field select{width:100%;min-height:42px;padding:0 11px;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface-2)}
.btnrow{display:flex;flex-direction:column;gap:9px}
.bigbtn{
  width:100%;min-height:46px;border-radius:11px;border:1px solid var(--border-strong);background:var(--surface-2);
  font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:9px
}
.bigbtn:active{background:var(--surface-0)}
.bigbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.bigbtn.danger{color:var(--critical);border-color:color-mix(in srgb,var(--critical) 40%,transparent)}
.help{font-size:13px;color:var(--text-secondary);line-height:1.5}
.help ol{margin:8px 0 0;padding-left:20px} .help li{margin-bottom:5px}
.empty{text-align:center;padding:34px 18px;color:var(--text-muted)}
.empty .big{font-size:15px;font-weight:600;color:var(--text-secondary);margin-bottom:5px}
.toast{
  position:fixed;left:50%;transform:translateX(-50%) translateY(20px);
  bottom:calc(78px + env(safe-area-inset-bottom));z-index:200;
  background:var(--text-primary);color:var(--surface-1);padding:10px 17px;border-radius:11px;
  font-size:13.5px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.22);
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:88vw;text-align:center
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.fabrow{
  position:fixed;left:16px;right:16px;bottom:calc(70px + env(safe-area-inset-bottom));z-index:55;
  display:flex;gap:9px;pointer-events:none
}
.fabrow button{
  pointer-events:auto;flex:1;min-height:46px;border-radius:12px;background:var(--accent);color:#fff;
  font-size:14.5px;font-weight:650;box-shadow:0 4px 18px rgba(0,0,0,.2);
  display:flex;align-items:center;justify-content:center;gap:8px
}
.fabrow button.ghost{background:var(--surface-2);color:var(--text-primary);border:1px solid var(--border-strong)}
.fabrow[hidden]{display:none}
.fabrow button[hidden]{display:none}   /* one button alone spans the row */
.sronly{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- iPad / wide ---------- */
@media (min-width:768px){
  main{padding:22px 26px calc(104px + env(safe-area-inset-bottom));max-width:1080px;margin:0 auto;width:100%}
  .topbar{padding:calc(env(safe-area-inset-top) + 11px) 26px 11px}
  .topbar-row{max-width:1080px;margin:0 auto;width:100%}
  .topbar h1{font-size:22px}
  .arealist{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .arealist .arearow{margin:0}
  .qtext{font-size:15.5px}
  .scale{max-width:560px}
  .scale button{min-height:46px;font-size:15.5px}
  .scalefoot{max-width:560px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .grid2 .card{margin-bottom:0}
  .fabrow{max-width:1080px;margin:0 auto;left:26px;right:26px}
  /* iPad: radar beside its numbered key instead of a tall stack */
  .chart-wide{display:flex;gap:22px;align-items:center;justify-content:center}
  .chart-wide .chart-host{flex:1 1 auto;min-width:0}
  .chart-wide .radarkey{grid-template-columns:1fr;width:auto;min-width:230px;margin-top:0;align-self:center}
  .chart-wide .radarkey li{font-size:12.5px;padding:3px 0}
  .tile .val{font-size:34px}
}
@media (min-width:1024px){
  .arealist{grid-template-columns:1fr 1fr 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

 Effective Category Management","q":"Risk Management Strategies: Develop contingency plans for supply chain disruptions.","sa":3,"ea":3},{"subject":"Best Practices for Effective Category Management","q":"Sustainability & ESG Considerations: Align procurement with environmental and ethical sourcing initiatives.","sa":3,"ea":3},{"subject":"Best Practices for Effective Category Management","q":"Supplier Development Programs: Foster long-term relationships and invest in supplier capabilities.","sa":3,"ea":3}]},{"id":"Financial_Management","name":"Financial Management","questions":[{"subject":"Governance & Strategy","q":"Do we have a centralized contract management system linked to POs and AP transactions?","sa":1,"ea":1},{"subject":"Governance & Strategy","q":"How effectively do we align procurement, finance, and supplier management strategies?","sa":4,"ea":4},{"subject":"Governance & Strategy","q":"Do we have clear policies for financial approvals and contract compliance?","sa":4,"ea":4},{"subject":"Data Integration & Visibility","q":"Can we track, match, and reconcile contracts, POs, and AP data in real time?","sa":6,"ea":6},{"subject":"Data Integration & Visibility","q":"Are contracts, POs, and AP transactions stored in a single platform, or do we rely on fragmented systems?","sa":5,"ea":5},{"subject":"Data Integration & Visibility","q":"What level of spend transparency do we have across all suppliers and categories?","sa":5,"ea":5},{"subject":"Spend Analysis & Reporting","q":"Do we regularly generate reports that compare contracted spend, PO commitments, and actual AP spend?","sa":7,"ea":7},{"subject":"Spend Analysis & Reporting","q":"Can we identify discrepancies between contract terms, PO issuance, and supplier invoices?","sa":7,"ea":7},{"subject":"Spend Analysis & Reporting","q":"How often do we perform variance analysis to detect overspending, leakage, or unapproved spend?","sa":7,"ea":7},{"subject":"Compliance & Risk Management","q":"How do we ensure supplier i
